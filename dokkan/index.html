<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dokkan Battle Replica</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Unofficial fan-made replica of Dragon Ball Z Dokkan Battle: board-game quests, ki sphere battles, link skills, Dokkan Mode, friend leaders and summon banners.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<style>
/* Layout: phone-shaped game column like the mobile game. HUD on top, tab bar at the bottom; quest map, battle and summons cover the column. Single bright arena look by design. */
:root{
  --bg:#061234; --bg2:#0c2266; --panel:#102a74; --panel2:#18388f; --line:#2c56c4; --ink:#ffffff; --muted:#b4c4f2;
  --gold:#ffd23a; --orange:#ff7a12; --red:#ff2f4a; --green:#33dd7f; --cyan:#4fe3ff;
  --agl:#2d8bff; --teq:#22c55e; --int:#a855f7; --str:#ef4444; --phy:#f59e0b;
  --f-d:"Bangers", Impact, "Arial Black", sans-serif;
  --f-b:"M PLUS Rounded 1c", "Arial Rounded MT Bold", system-ui, -apple-system, sans-serif;
  --gut-l:max(16px, env(safe-area-inset-left, 0px)); --gut-r:max(16px, env(safe-area-inset-right, 0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#030918;color:var(--ink);font-family:var(--f-b);font-weight:700;font-size:14px;line-height:1.4;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.ol{-webkit-text-stroke:4px #1b0b00;paint-order:stroke fill}
#app{position:relative;max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;
  background:linear-gradient(180deg,#0f3aa8 0%,#0a2370 38%,var(--bg) 100%)}

/* HUD */
.hud{display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:6px;align-items:center;padding-block:8px;padding-left:var(--gut-l);padding-right:var(--gut-r);background:linear-gradient(180deg,#071a52,#0a2370);border-bottom:2px solid #000}
.rank{display:flex;align-items:center;gap:5px}
.rank b{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:15px;background:radial-gradient(circle at 35% 30%,#fff7c2,var(--gold) 45%,#c27a00);color:#3a1d00;border:2px solid #fff}
.rank small,.pill small{display:block;font-size:9px;letter-spacing:.08em;color:var(--muted);line-height:1}
.xp{width:44px;height:5px;border-radius:9px;background:#000a;margin-top:3px;overflow:hidden}
.xp i{display:block;height:100%;background:var(--cyan)}
.pill{min-width:0;display:flex;align-items:center;gap:5px;background:#0009;border:1px solid #ffffff2a;border-radius:99px;padding:3px 8px;font-variant-numeric:tabular-nums;font-size:12px;white-space:nowrap}
.pill b{overflow:hidden;text-overflow:ellipsis}
.pill.act{flex-direction:column;align-items:flex-start;gap:0;border-radius:10px;padding:2px 8px}
.pill.act em{font-style:normal;font-size:9px;color:var(--green)}
.zico{width:15px;height:15px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:9px;background:radial-gradient(circle at 35% 30%,#fff3a0,#e0a400);color:#5a3500}
.dsico{width:13px;height:15px;flex:none;clip-path:polygon(50% 0,100% 35%,80% 100%,20% 100%,0 35%);background:linear-gradient(160deg,#fff 0%,#ff9de0 25%,#ff3d6e 55%,#ffb21a 100%)}

#screen{flex:1;overflow-y:auto;padding-block:14px 22px;padding-left:var(--gut-l);padding-right:var(--gut-r);display:flex;flex-direction:column;gap:12px}
#screen>*{flex-shrink:0}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);background:linear-gradient(180deg,#0b2470,#061541);border-top:2px solid #000;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs button{border:0;background:none;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:10px;letter-spacing:.04em}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--gold);background:radial-gradient(ellipse at 50% 100%,#ffd23a33,transparent 70%)}

h2.sec{margin:0;font-family:var(--f-d);font-weight:400;font-size:30px;letter-spacing:.04em;line-height:1;color:var(--gold);-webkit-text-stroke:5px #241000;paint-order:stroke fill}
.sub{margin:-4px 0 0;color:var(--muted);font-weight:500}

/* buttons */
.btn{border:2px solid #fff6;border-radius:12px;padding:10px 14px;font-weight:800;letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:linear-gradient(180deg,#ffc04a,#ff7a12 55%,#e05200);box-shadow:0 4px 0 #7a2800,inset 0 2px 0 #fff6;text-shadow:0 2px 0 #7a2800}
.btn.blue{background:linear-gradient(180deg,#63b4ff,#2d6bff 55%,#1a45c8);box-shadow:0 4px 0 #0c2470,inset 0 2px 0 #fff6;text-shadow:0 2px 0 #0c2470}
.btn.gray{background:linear-gradient(180deg,#5d6a92,#3a4570);box-shadow:0 4px 0 #1a2040;text-shadow:none}
.btn.green{background:linear-gradient(180deg,#7dffb0,#1fbf62 55%,#0f8a43);box-shadow:0 4px 0 #064020;text-shadow:0 2px 0 #064020}
.btn:disabled{filter:grayscale(.8) brightness(.7);cursor:not-allowed}
.btn:not(:disabled):active{transform:translateY(3px);box-shadow:0 1px 0 #0006}
.cost{display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.cost::before{content:"";width:11px;height:13px;clip-path:polygon(50% 0,100% 35%,80% 100%,20% 100%,0 35%);background:linear-gradient(160deg,#fff,#ff9de0 25%,#ff3d6e 55%,#ffb21a)}

/* badges */
.tb{display:inline-flex;align-items:center;font-style:normal;font-size:9px;font-weight:800;letter-spacing:.02em;padding:1px 5px;border-radius:5px;color:#fff;background:var(--tc);line-height:1.4;vertical-align:1px;border:1px solid #fff8;text-shadow:0 1px 0 #0008}
.tb.E{background:linear-gradient(135deg,var(--tc) 55%,#000 55%)}
.t-AGL{--tc:var(--agl)} .t-TEQ{--tc:var(--teq)} .t-INT{--tc:var(--int)} .t-STR{--tc:var(--str)} .t-PHY{--tc:var(--phy)}
.r-R{--rc:#c08452} .r-SR{--rc:#d9e2f0} .r-SSR{--rc:var(--gold)} .r-UR{--rc:#ff7ae6} .r-LR{--rc:#fff}

/* unit card */
.uc{position:relative;display:block;width:100%;aspect-ratio:1;max-width:100%;padding:0;border-radius:10px;border:3px solid var(--rc);background:var(--panel);overflow:hidden;box-shadow:0 3px 0 #0008}
.uc svg{display:block;width:100%;height:100%}
.uc .tb{position:absolute;left:2px;top:2px}
.uc .rb{position:absolute;left:3px;bottom:0;font-family:var(--f-d);font-weight:400;font-size:19px;letter-spacing:.03em;color:var(--rc);-webkit-text-stroke:3px #000;paint-order:stroke fill;line-height:1.15}
.uc .lv{position:absolute;right:2px;bottom:2px;font-size:9px;background:#000c;border-radius:5px;padding:0 4px}
.uc .lead{position:absolute;right:2px;top:2px;font-size:9px;background:var(--gold);color:#2a1600;border-radius:5px;padding:0 4px}
.r-UR.uc{border-color:transparent;background:linear-gradient(var(--panel),var(--panel)) padding-box,linear-gradient(135deg,#ffe36a,#ff6bd5,#7a5cff,#4fe3ff) border-box}
.r-LR.uc{border-color:transparent;background:linear-gradient(var(--panel),var(--panel)) padding-box,linear-gradient(120deg,#ff3d4d,#ff9f1c,#ffe14a,#22c55e,#2d8bff,#a855f7,#ff3d4d) border-box;background-size:100% 100%,300% 100%;animation:lr 3s linear infinite}
.r-LR .rb{background:linear-gradient(90deg,#ff8a8a,#ffe14a,#7dffb0,#7ab8ff,#d38bff);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:0;filter:drop-shadow(0 2px 0 #000)}
@keyframes lr{to{background-position:0 0,300% 0}}
.uc.unknown svg{filter:brightness(0)}
.uc.unknown::after{content:"?";position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-d);font-size:34px;color:var(--muted)}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.nm{font-size:10px;color:var(--muted);text-align:center;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* home */
.hero{position:relative;height:300px;border-radius:18px;overflow:hidden;border:3px solid #fff;box-shadow:0 6px 0 #0007}
.hero>svg{width:100%;height:100%;display:block}
.hero-tag{position:absolute;left:12px;bottom:10px;right:12px}
.hero-tag small{display:block;font-size:12px;color:#fff;text-shadow:0 2px 0 #000}
.hero-tag b{font-family:var(--f-d);font-weight:400;font-size:40px;line-height:1;letter-spacing:.03em;-webkit-text-stroke:5px #000;paint-order:stroke fill}
.hero .tb{position:absolute;left:12px;top:12px;font-size:12px}
.hero .rar{position:absolute;right:12px;top:6px;font-family:var(--f-d);font-size:38px;color:var(--rc);-webkit-text-stroke:5px #000;paint-order:stroke fill}
.home-btns{display:grid;grid-template-columns:1.3fr 1fr;gap:10px}
.home-btns .btn{font-family:var(--f-d);font-weight:400;font-size:26px;letter-spacing:.05em;padding:12px}
.login{display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(90deg,#ff7a1255,#ffd23a22);border:2px solid var(--gold);border-radius:14px;padding:10px 12px}
.news{display:flex;flex-direction:column;gap:8px}
.news button{position:relative;height:84px;border:2px solid #fff;border-radius:14px;overflow:hidden;padding:0;text-align:left;background:linear-gradient(110deg,var(--c2),var(--c1))}
.news button .art{position:absolute;right:0;top:0;width:120px;height:100%}
.news button .art svg{width:100%;height:100%;display:block}
.news button b{position:absolute;left:12px;top:12px;font-family:var(--f-d);font-weight:400;font-size:24px;letter-spacing:.03em;-webkit-text-stroke:4px #000;paint-order:stroke fill;max-width:62%;line-height:1}
.news button small{position:absolute;left:12px;bottom:10px;font-size:11px;text-shadow:0 1px 0 #000}
.fine{margin:4px 0 0;font-size:10px;font-weight:500;color:var(--muted);line-height:1.5}

/* quest list */
.stage{display:grid;grid-template-columns:86px minmax(0,1fr);gap:12px;align-items:center;background:linear-gradient(180deg,var(--panel2),var(--panel));border:2px solid var(--line);border-radius:16px;padding:10px;text-align:left;width:100%}
.stage.locked{filter:grayscale(.7) brightness(.7)}
.stage .boss{width:86px;height:86px;border-radius:12px;overflow:hidden;border:3px solid var(--tc)}
.stage .boss svg{width:100%;height:100%;display:block}
.stage h3{margin:0;font-family:var(--f-d);font-weight:400;font-size:24px;letter-spacing:.03em;line-height:1;-webkit-text-stroke:4px #000;paint-order:stroke fill}
.stage .saga{font-size:10px;letter-spacing:.12em;color:var(--gold);text-transform:uppercase}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:var(--muted);margin-top:4px;font-weight:500}
.meta b{color:#fff}
.clear{color:var(--green)}
.medal{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-2px;background:radial-gradient(circle at 35% 30%,#fff,var(--mc) 50%,#0006);border:1px solid #fff8}

/* summon */
.banner{border:3px solid #fff;border-radius:18px;overflow:hidden;background:var(--panel);box-shadow:0 5px 0 #0007}
.banner-art{position:relative;height:180px;background:radial-gradient(circle at 70% 45%,var(--c1),transparent 62%),linear-gradient(160deg,var(--c2),#060a24)}
.banner-art .rays{position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 70% 45%,#ffffff18 0 5deg,transparent 5deg 15deg)}
.f1,.f2{position:absolute;border-radius:14px;overflow:hidden;border:3px solid #fff;box-shadow:0 8px 20px #0009}
.f1{right:12px;top:12px;width:136px;height:156px}
.f2{right:136px;top:58px;width:92px;height:110px;border-color:#fffa}
.f1 svg,.f2 svg{width:100%;height:100%;display:block}
.banner-art .bt{position:absolute;left:12px;top:12px;max-width:44%}
.bt .k{display:inline-block;font-size:10px;letter-spacing:.14em;background:var(--red);padding:1px 7px;border-radius:4px;border:1px solid #fff}
.bt h3{margin:6px 0 0;font-family:var(--f-d);font-weight:400;font-size:30px;line-height:.95;letter-spacing:.03em;-webkit-text-stroke:5px #000;paint-order:stroke fill;color:var(--gold)}
.bt p{margin:4px 0 0;font-size:12px;text-shadow:0 2px 0 #000}
.banner-body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}
.rates{font-size:10px;color:var(--muted);font-weight:500}
.pulls{display:grid;grid-template-columns:1fr 1.3fr;gap:10px}

/* team / detail */
.box{background:linear-gradient(180deg,var(--panel2),var(--panel));border:2px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.box .k{font-size:10px;letter-spacing:.14em;color:var(--gold);text-transform:uppercase}
.box p{margin:0;font-weight:500;color:var(--muted);font-size:12px}
.slot-empty{width:100%;aspect-ratio:1;border-radius:10px;border:2px dashed var(--line);background:#0003;color:var(--muted);font-size:28px}
.rot-guide{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:10px;color:var(--muted);text-align:center;font-weight:500}
.rot-guide div{background:#0004;border-radius:8px;padding:4px}
.rot-guide b{color:#fff;display:block;font-size:11px}

.modal-bg{position:absolute;inset:0;z-index:80;background:#000c;display:grid;place-items:center;padding-block:14px;padding-left:var(--gut-l);padding-right:var(--gut-r)}
.modal{width:100%;max-width:430px;max-height:100%;overflow-y:auto;background:linear-gradient(180deg,#163a9e,#0c2266);border:3px solid #fff;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;animation:pop .2s ease-out;box-shadow:0 8px 0 #0008}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.modal h3{margin:0;font-family:var(--f-d);font-weight:400;font-size:28px;letter-spacing:.04em;line-height:1;-webkit-text-stroke:5px #000;paint-order:stroke fill}
.modal .row{display:flex;gap:10px;flex-wrap:wrap}
.modal .row .btn{flex:1}
.modal p{margin:0;font-weight:500}
.dt-hd{display:grid;grid-template-columns:116px minmax(0,1fr);gap:12px;align-items:center}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.kv div{background:#0005;border-radius:10px;padding:5px 2px}
.kv small{display:block;font-size:9px;letter-spacing:.12em;color:var(--muted)}
.kv b{font-variant-numeric:tabular-nums}
.sk{background:#0004;border-radius:10px;padding:7px 10px;border-left:4px solid var(--tc,var(--gold))}
.sk .k{font-size:9px;letter-spacing:.14em;color:var(--gold);text-transform:uppercase}
.sk .n{font-size:14px}
.sk p{font-size:12px;color:var(--muted);margin:1px 0 0;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips span{font-size:10px;border:1px solid #ffffff44;border-radius:99px;padding:0 7px;color:var(--muted);font-weight:500}
.chips span.on{border-color:var(--gold);color:var(--gold)}
.friend{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;align-items:center;background:#0004;border:2px solid var(--line);border-radius:12px;padding:8px;text-align:left;width:100%}
.friend small{display:block;color:var(--muted);font-size:10px;font-weight:500}
.friend p{font-size:11px;color:var(--cyan);margin:2px 0 0;font-weight:500}
.toast{position:absolute;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:95;background:#000e;border:2px solid var(--gold);border-radius:12px;padding:8px 14px;max-width:calc(100% - 32px);text-align:center;animation:pop .2s}

/* ===== quest map ===== */
.run{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;background:var(--bg)}
.run-top{display:flex;align-items:center;gap:8px;padding-block:8px;padding-left:var(--gut-l);padding-right:var(--gut-r);background:#050d2a;border-bottom:2px solid #000;font-size:12px}
.run-top b{font-family:var(--f-d);font-weight:400;font-size:19px;letter-spacing:.03em}
.ghost{border:1px solid #ffffff44;background:#0006;border-radius:8px;padding:3px 9px;font-size:11px}
.run-hp{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;padding-block:6px;padding-left:var(--gut-l);padding-right:var(--gut-r);background:#050d2a;font-size:11px}
.map{position:relative;flex:1;overflow-y:auto;overflow-x:hidden;background:radial-gradient(ellipse at 50% 30%,var(--m1),transparent 70%),linear-gradient(180deg,var(--m2),var(--m3))}
.map-in{position:relative;margin-inline:auto;max-width:440px}
.map-in>svg{position:absolute;inset:0;width:100%;height:100%}
.tile{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 40% 30%,#4d72d8,#1b3a8f);border:3px solid #fff;box-shadow:0 4px 0 #0008;font-size:10px;overflow:hidden}
.tile.b,.tile.B{border-color:var(--red)}
.tile.B{width:76px;height:76px;margin:-38px 0 0 -38px;border-width:4px}
.tile svg{width:100%;height:100%;display:block}
.tile.done{filter:grayscale(1) brightness(.6)}
.tile-lab{position:absolute;bottom:-1px;left:0;right:0;text-align:center;font-size:9px;background:#000b;line-height:1.4}
.ic-coin{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7b0,#e0a400 60%,#8a5a00);display:grid;place-items:center;color:#5a3500;font-size:14px;border:2px solid #fff6}
.ic-bean{width:18px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d8ffb0,#4fbf2a 60%,#2a6a12);transform:rotate(20deg)}
.ic-cross{width:28px;height:28px;background:var(--green);clip-path:polygon(35% 0,65% 0,65% 35%,100% 35%,100% 65%,65% 65%,65% 100%,35% 100%,35% 65%,0 65%,0 35%,35% 35%)}
.ic-medal{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--mc) 50%,#0008);border:2px solid #fff8}
.ic-ds{width:24px;height:28px;clip-path:polygon(50% 0,100% 35%,80% 100%,20% 100%,0 35%);background:linear-gradient(160deg,#fff,#ff9de0 25%,#ff3d6e 55%,#ffb21a)}
.token{position:absolute;width:52px;height:52px;margin:-62px 0 0 -26px;border-radius:50%;overflow:hidden;border:3px solid var(--gold);box-shadow:0 0 0 3px #000,0 8px 14px #000a;transition:left .2s ease-out,top .2s ease-out;z-index:3;animation:hop .2s}
.token svg{width:100%;height:100%;display:block}
.run-ctrl{display:flex;align-items:center;justify-content:center;gap:16px;padding-block:10px calc(12px + env(safe-area-inset-bottom,0px));padding-left:var(--gut-l);padding-right:var(--gut-r);background:linear-gradient(180deg,#0b2470,#050d2a);border-top:2px solid #000}
.dice{width:86px;height:110px;border-radius:12px;border:3px solid #fff;background:linear-gradient(160deg,#ffcf4a,#ff7a12);box-shadow:0 5px 0 #7a2800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
.dice span{font-family:var(--f-d);font-size:60px;line-height:1;-webkit-text-stroke:6px #4a1a00;paint-order:stroke fill}
.dice small{font-size:9px;color:#4a1a00}
.dice:disabled{filter:grayscale(.6) brightness(.7)}
.ctrl-info{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);max-width:200px;font-weight:500}
.ctrl-info b{color:#fff;font-size:13px}
.evt{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);z-index:10;background:#000d;border:3px solid var(--gold);border-radius:16px;padding:12px 18px;text-align:center;font-size:16px;animation:pop .2s;pointer-events:none;white-space:nowrap}
.evt b{display:block;font-family:var(--f-d);font-weight:400;font-size:28px;color:var(--gold);letter-spacing:.04em}
@keyframes hop{50%{transform:translateY(-12px)}}

/* ===== battle ===== */
.battle{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;background:var(--bg);overflow-y:auto;overflow-x:hidden}
.b-top{display:flex;align-items:center;gap:8px;padding-block:6px;padding-left:var(--gut-l);padding-right:var(--gut-r);background:#050d2a;font-size:11px;color:var(--muted)}
.b-top b{color:#fff;font-family:var(--f-d);font-weight:400;font-size:17px;letter-spacing:.03em}
.foes-wrap{position:relative;flex:1 0 auto;min-height:200px;display:flex;align-items:center;justify-content:center;padding-block:10px;padding-left:var(--gut-l);padding-right:var(--gut-r);overflow:hidden;background:radial-gradient(ellipse at 50% 40%,var(--m1),transparent 70%),linear-gradient(180deg,var(--m2),var(--m3))}
.foes-wrap::before{content:"";position:absolute;left:-10%;right:-10%;bottom:0;height:34%;background:var(--m4);clip-path:polygon(0 40%,15% 10%,30% 35%,48% 0,64% 30%,80% 8%,100% 30%,100% 100%,0 100%)}
.foes{position:relative;z-index:1;display:flex;gap:10px;align-items:flex-end;justify-content:center;width:100%}
.foe{position:relative;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:5px;width:var(--fw);min-width:0}
.foe-pt{width:var(--fw);height:var(--fw);border-radius:50%;overflow:hidden;border:4px solid var(--tc);box-shadow:0 0 0 3px #000,0 0 26px var(--tc)}
.foe-pt svg{width:100%;height:100%;display:block}
.foe.tgt .foe-pt{box-shadow:0 0 0 3px var(--gold),0 0 30px var(--gold)}
.foe.tgt::after{content:"";position:absolute;top:calc(var(--fw)/2 - 18px);left:50%;width:36px;height:36px;margin-left:-18px;border:3px solid var(--gold);border-radius:50%;box-shadow:0 0 0 2px #000;animation:pulse 1s infinite;pointer-events:none}
.foe.dead{visibility:hidden}
.foe-nm{display:flex;gap:4px;align-items:center;font-size:11px;max-width:100%;white-space:nowrap;overflow:hidden;text-shadow:0 1px 0 #000}
.hpb{position:relative;width:100%;height:9px;border-radius:9px;background:var(--hb-back);border:2px solid #000;overflow:hidden}
.hpb i{position:absolute;inset:0 auto 0 0;background:var(--hb-front);transition:width .35s}
.hpb-x{position:absolute;right:-2px;top:-14px;font-family:var(--f-d);font-size:15px;color:#fff;-webkit-text-stroke:3px #000;paint-order:stroke fill}
.foe .stun{position:absolute;top:2px;left:50%;transform:translateX(-50%);font-size:10px;background:var(--cyan);color:#002;border-radius:5px;padding:0 5px}
.foe.hit .foe-pt{animation:shake .35s}
.foe.lunge .foe-pt{animation:lunge .3s}
.foe.down .foe-pt{animation:down .5s forwards}
@keyframes shake{20%{transform:translateX(-8px) rotate(-4deg);filter:brightness(2.5)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@keyframes lunge{50%{transform:translateY(20px) scale(1.15)}}
@keyframes down{to{transform:scale(.3) rotate(30deg);opacity:0;filter:brightness(3)}}
@keyframes pulse{50%{transform:scale(1.12)}}
.order{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding-block:6px;padding-left:var(--gut-l);padding-right:var(--gut-r);background:#050d2a}
.ord{position:relative;display:flex;align-items:center;gap:5px;height:34px;background:#ffffff10;border:2px solid #ffffff22;border-radius:9px;padding:0 6px}
.ord.next{border-color:var(--gold)}
.ord-n{font-family:var(--f-d);font-size:20px;color:var(--gold);-webkit-text-stroke:3px #000;paint-order:stroke fill;width:12px}
.ord-pt{width:26px;height:26px;border-radius:6px;overflow:hidden;flex:none}
.ord-pt svg{width:100%;height:100%;display:block}
.mks{display:flex;gap:2px;margin-left:auto}
.mk{font-style:normal;font-size:10px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--red);border:2px solid #fff;color:#fff}
.mk.sup{background:#000;border-color:var(--gold);color:var(--gold);font-size:8px}
.board-wrap{position:relative;padding-block:6px;padding-left:var(--gut-l);padding-right:var(--gut-r);background:linear-gradient(180deg,#050d2a,#0a1a4a)}
.board{--cell:min(54px,6.6vh);display:grid;grid-template-columns:repeat(6,1fr);gap:6px;width:min(100%,calc(var(--cell)*6 + 46px));margin:0 auto;padding:8px;border-radius:14px;background:#0008;border:2px solid #ffffff22}
.sp{aspect-ratio:1;max-width:100%;border-radius:50%;border:0;padding:0;position:relative;
  background:radial-gradient(circle at 33% 27%,#ffffffee 0 10%,transparent 12%),radial-gradient(circle at 50% 55%,var(--c) 0 40%,color-mix(in srgb,var(--c) 38%,#000) 80%);
  box-shadow:inset 0 -4px 6px #0007,0 0 10px color-mix(in srgb,var(--c) 55%,transparent);transition:transform .12s}
.s-AGL{--c:var(--agl)} .s-TEQ{--c:var(--teq)} .s-INT{--c:var(--int)} .s-STR{--c:var(--str)} .s-PHY{--c:var(--phy)}
.s-RBW{--c:#fff;background:radial-gradient(circle at 33% 27%,#fff 0 10%,transparent 12%),conic-gradient(#ff3d4d,#ff9f1c,#ffe14a,#22c55e,#2d8bff,#a855f7,#ff3d4d)}
.sp.hl{transform:scale(1.14);box-shadow:0 0 0 3px #fff,0 0 16px var(--c)}
.sp.take{visibility:hidden}
.sp.new{animation:drop .3s ease-out}
@keyframes drop{from{transform:translateY(-36px);opacity:0}}
.fly{position:absolute;z-index:20;pointer-events:none;border-radius:50%;transition:transform .38s cubic-bezier(.5,0,.8,.4),opacity .38s}
.mates{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;padding-block:6px 6px;padding-left:var(--gut-l);padding-right:var(--gut-r);background:#0a1a4a}
.mate{position:relative;display:flex;flex-direction:column;gap:3px;background:linear-gradient(180deg,#1b3a96,#0e2468);border:3px solid var(--rc);border-radius:12px;padding:5px;text-align:left;transition:transform .15s,filter .2s}
.mate.sel{transform:translateY(-6px);box-shadow:0 0 0 3px var(--gold),0 0 22px #ffd23a88}
.mate.done{filter:grayscale(.6) brightness(.6)}
.mate.hit{animation:shake .35s}
.mate-hd{display:flex;gap:5px;align-items:center;min-width:0}
.mate-pt{width:42px;height:42px;flex:none;border-radius:8px;overflow:hidden;border:2px solid #000}
.mate-pt svg{width:100%;height:100%;display:block}
.mate-nm{min-width:0;font-size:10px;line-height:1.25}
.mate-nm b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mate-nm em{font-style:normal;color:var(--rc)}
.mate-pos{position:absolute;top:-10px;left:-6px;width:22px;height:22px;border-radius:50%;background:var(--gold);color:#2a1600;display:grid;place-items:center;font-size:12px;border:2px solid #000;z-index:2}
.link{position:absolute;top:-9px;right:-4px;font-size:8px;background:linear-gradient(90deg,#4fe3ff,#2d8bff);color:#001;border-radius:6px;padding:1px 5px;border:1px solid #fff;z-index:2}
.ki{display:grid;grid-template-columns:repeat(12,1fr);gap:1px;height:8px;background:#000;border-radius:3px;padding:1px}
.ki i{background:#ffffff1c;border-radius:1px}
.ki i.k1{background:linear-gradient(180deg,#fff7a0,var(--gold))}
.ki i.k2{background:linear-gradient(180deg,#ffb3f0,#ff4fd5)}
.ki-row{display:flex;justify-content:space-between;font-size:9px;color:var(--muted);font-variant-numeric:tabular-nums}
.ki-row .sa{color:var(--gold)} .ki-row .ua{color:#ff7ae6}
.prev{position:absolute;left:50%;top:-14px;transform:translateX(-50%);font-family:var(--f-d);font-size:17px;color:#fff;-webkit-text-stroke:3px #000;paint-order:stroke fill;z-index:3;pointer-events:none;white-space:nowrap}
.b-foot{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding-block:6px calc(8px + env(safe-area-inset-bottom,0px));padding-left:var(--gut-l);padding-right:var(--gut-r);background:#0a1a4a}
.bar{position:relative;height:12px;border-radius:9px;background:#000;border:2px solid #000;overflow:hidden}
.bar>i{position:absolute;inset:0 auto 0 0;transition:width .35s}
.bar.hp>i{background:linear-gradient(180deg,#9dffb8,#1fbf62)}
.bar.hp.low>i{background:linear-gradient(180deg,#ffb0b0,#ff2f4a)}
.bar.dk{height:8px}
.bar.dk>i{background:linear-gradient(90deg,#ffe14a,#ff9f1c)}
.bar.dk.full>i{background:linear-gradient(90deg,#ff3d4d,#ff9f1c,#ffe14a,#22c55e,#2d8bff,#a855f7);animation:lr 1s linear infinite;background-size:200% 100%}
.lab{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.senzu{grid-row:span 2;display:flex;align-items:center;gap:5px;border:2px solid #fff6;border-radius:10px;background:#1fbf6233;padding:4px 8px;font-size:11px}
.senzu:disabled{opacity:.4}
.b-log{position:absolute;left:0;right:0;bottom:4px;z-index:2;text-align:center;font-size:11px;text-shadow:0 1px 2px #000;padding-inline:var(--gut-l);pointer-events:none}
.pop{position:absolute;z-index:30;font-family:var(--f-d);font-size:38px;color:#fff;-webkit-text-stroke:5px #2a0a00;paint-order:stroke fill;pointer-events:none;white-space:nowrap;animation:float 1.1s ease-out forwards}
.pop.crit{color:var(--gold);font-size:46px}
.pop.big{font-size:52px;color:#ffe0fa}
.pop.small{font-size:20px}
.pop.bad{color:#ff6b7a;font-size:26px}
.pop.info{color:var(--cyan);font-size:22px}
@keyframes float{0%{transform:translate(-50%,8px) scale(.5);opacity:0}15%{transform:translate(-50%,0) scale(1.15);opacity:1}70%{opacity:1}100%{transform:translate(-50%,-36px);opacity:0}}
.cutin{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;pointer-events:none;background:#000c;animation:fade 1.15s forwards}
.cutin .band{position:relative;width:140%;height:210px;transform:rotate(-8deg);background:linear-gradient(90deg,var(--tc),color-mix(in srgb,var(--tc) 40%,#000));border-block:5px solid #fff;display:flex;align-items:center;gap:14px;padding-left:22%;overflow:hidden}
.cutin.ua .band{background:linear-gradient(90deg,#ff4fd5,#7a2cff,#2d8bff)}
.cutin .band::before{content:"";position:absolute;inset:-60%;background:repeating-conic-gradient(from 0deg,#ffffff26 0 4deg,transparent 4deg 12deg);animation:spin 2s linear infinite}
.cutin .ca{position:relative;width:190px;height:190px;flex:none;transform:rotate(8deg);animation:slide 1.15s ease-out}
.cutin .ca svg{width:100%;height:100%;display:block;border-radius:16px;border:4px solid #fff}
.cutin .ct{position:relative;transform:rotate(8deg);max-width:200px}
.cutin .ct small{display:block;font-size:11px;letter-spacing:.2em;text-shadow:0 2px 0 #000}
.cutin .ct b{font-family:var(--f-d);font-weight:400;font-size:40px;line-height:.95;letter-spacing:.02em;-webkit-text-stroke:6px #000;paint-order:stroke fill}
@keyframes fade{0%{opacity:0}8%{opacity:1}88%{opacity:1}100%{opacity:0}}
@keyframes slide{from{transform:translateX(-160%) rotate(8deg)}30%{transform:translateX(0) rotate(8deg)}}
@keyframes spin{to{transform:rotate(1turn)}}
.beam{position:absolute;z-index:25;height:22px;margin-top:-11px;transform-origin:0 50%;border-radius:11px;pointer-events:none;background:linear-gradient(180deg,transparent,var(--bc) 25%,#fff 50%,var(--bc) 75%,transparent);box-shadow:0 0 24px var(--bc);animation:beam .45s ease-out forwards}
@keyframes beam{0%{clip-path:inset(0 100% 0 0)}50%{clip-path:inset(0 0 0 0);opacity:1}100%{clip-path:inset(0 0 0 0);opacity:0}}
.banner-fx{position:absolute;inset:0;z-index:45;display:grid;place-items:center;pointer-events:none;font-family:var(--f-d);font-size:58px;letter-spacing:.05em;color:#fff;-webkit-text-stroke:7px #000;paint-order:stroke fill;animation:fade 1.1s forwards;text-align:center;line-height:1}
.banner-fx.warn{color:var(--red);background:repeating-linear-gradient(-45deg,#ff2f4a22 0 18px,transparent 18px 36px)}
.banner-fx.dok{color:var(--gold)}
.dokkan{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(circle,#ffb000aa,#200800ee 70%)}
.dokkan h3{margin:0;font-family:var(--f-d);font-weight:400;font-size:56px;color:var(--gold);-webkit-text-stroke:7px #3a1000;paint-order:stroke fill;letter-spacing:.04em;line-height:1}
.dokkan .tap{width:150px;height:150px;border-radius:50%;border:5px solid #fff;background:conic-gradient(#ff3d4d,#ff9f1c,#ffe14a,#22c55e,#2d8bff,#a855f7,#ff3d4d);font-family:var(--f-d);font-size:44px;-webkit-text-stroke:6px #000;paint-order:stroke fill;animation:pulse .4s infinite}
.dokkan .meter{width:220px;height:14px;border-radius:9px;background:#000;border:2px solid #fff;overflow:hidden}
.dokkan .meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffe14a,#ff3d4d)}

/* summon scene */
.summon{position:absolute;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding-block:18px;padding-left:var(--gut-l);padding-right:var(--gut-r);background:radial-gradient(circle at 50% 38%,#1d3a9a,#02061a 72%);overflow-y:auto}
.summon.gold{background:radial-gradient(circle at 50% 38%,#ffb000,#3a1400 72%)}
.summon.rainbow{background:radial-gradient(circle at 50% 38%,#ff7ae6,#2a0a5a 50%,#02061a 80%)}
.dball{width:150px;height:150px;border-radius:50%;border:0;position:relative;background:radial-gradient(circle at 34% 28%,#fff 0 7%,#ffd27a 16%,#ff8a12 50%,#b04800 100%);box-shadow:0 0 50px #ff9a2a,0 0 120px #ff9a2a88;animation:pulse 1.2s ease-in-out infinite}
.dball i{position:absolute;width:24px;height:24px;background:#e8141e;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.summon .hint{font-size:12px;letter-spacing:.14em;color:#fff;text-transform:uppercase;text-shadow:0 2px 0 #000}
.summon h3{margin:0;font-family:var(--f-d);font-weight:400;font-size:40px;letter-spacing:.05em;-webkit-text-stroke:6px #000;paint-order:stroke fill;color:var(--gold)}
.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;width:100%;max-width:440px}
.cards.one{grid-template-columns:minmax(0,170px);justify-content:center}
.cardx{position:relative;aspect-ratio:3/4;border:0;padding:0;border-radius:10px;perspective:600px;background:none}
.cardx .face,.cardx .back{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;transition:transform .45s}
.cardx .back{display:grid;place-items:center;border:3px solid #fff;background:radial-gradient(circle,var(--gc),#0a1240 75%);box-shadow:0 0 18px var(--gc)}
.cardx .back::after{content:"";width:40%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 34% 28%,#fff 0 8%,#ffb03a 30%,#b04800)}
.cardx .face{transform:rotateY(180deg);display:flex;flex-direction:column;justify-content:center}
.cardx.open .back{transform:rotateY(180deg)}
.cardx.open .face{transform:rotateY(0)}
.cardx .tag{font-size:9px;text-align:center;color:var(--green);margin-top:2px}
.cardx .tag.dup{color:var(--muted)}
.awk{position:absolute;inset:0;z-index:99;display:grid;place-items:center;pointer-events:none;background:radial-gradient(circle,#fff,#ffd23a 30%,#ff7a12 55%,transparent 75%);animation:fade 1.4s forwards;font-family:var(--f-d);font-size:46px;color:#fff;-webkit-text-stroke:6px #000;paint-order:stroke fill;text-align:center}

@media (max-width:400px){ .hero{height:250px} .f1{width:112px;height:130px} .f2{right:116px;width:78px;height:96px;top:66px} .cutin .ca{width:150px;height:150px} .cutin .ct b{font-size:32px} }
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important} .cutin,.banner-fx,.awk{animation:none} }
</style>
</head>
<body>
<div id="app">
  <header class="hud">
    <div class="rank"><b id="h-rank">1</b><div><small>RANK</small><div class="xp"><i id="h-xp"></i></div></div></div>
    <div class="pill act"><small>ACT</small><b id="h-act">0/0</b><em id="h-actt"></em></div>
    <div class="pill" title="Zeni"><span class="zico">Z</span><b id="h-zeni">0</b></div>
    <div class="pill" title="Dragon Stones"><span class="dsico"></span><b id="h-ds">0</b></div>
  </header>
  <main id="screen"></main>
  <nav class="tabs" aria-label="Main">
    <button data-act="tab" data-arg="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
    <button data-act="tab" data-arg="quest"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V4l8 3 8-3v14l-8 3-8-3"/><path d="M12 7v14"/></svg>Quest</button>
    <button data-act="tab" data-arg="summon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5l1.3 2.8 3 .3-2.3 2 .7 3-2.7-1.6-2.7 1.6.7-3-2.3-2 3-.3z"/></svg>Summon</button>
    <button data-act="tab" data-arg="team"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.6c2.7.1 4.6 1.8 5.3 4.6"/></svg>Team</button>
    <button data-act="tab" data-arg="chars"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="9" rx="1.5"/><rect x="3" y="14" width="18" height="7" rx="1.5"/></svg>Characters</button>
  </nav>
</div>
<script>
'use strict';
/* ====================== constants ====================== */
const TYPES = ['AGL','TEQ','INT','STR','PHY'];
const TCOL  = {AGL:'#2d8bff',TEQ:'#22c55e',INT:'#a855f7',STR:'#ef4444',PHY:'#f59e0b'};
const TDARK = {AGL:'#0b2f7a',TEQ:'#07502a',INT:'#40107a',STR:'#7a0d18',PHY:'#7a4600'};
const BEATS = {AGL:'STR',STR:'PHY',PHY:'INT',INT:'TEQ',TEQ:'AGL'};
const RANK  = {R:0,SR:1,SSR:2,UR:3,LR:4};
const ED = "Earth's Defenders", SS = 'Super Saiyans', TC = 'Terrifying Conquerors';
const MEDALS = {nappa:{name:'Nappa Medal',c:'#c98a4a'}, frieza:{name:'Frieza Medal',c:'#b77cff'}, cell:{name:'Cell Medal',c:'#7cd65a'}};
const AWAKEN = {medals:5, zeni:10000};
const ACT_MS = 60000;

const LINKS = {
  'Super Saiyan':{atk:10}, 'Kamehameha':{atk:5}, 'Turtle School':{ki:1}, 'Crane School':{ki:1},
  'Fierce Battle':{atk:15}, 'Master and Pupil':{atk:10,def:10}, 'Saiyan Warrior Race':{ki:2},
  'Prodigies':{atk:10}, 'Galactic Warriors':{atk:10}, 'Big Bad Bosses':{def:25},
  'Infinite Regeneration':{def:15}, 'Golden Warrior':{atk:15,def:15},
};

/* looks: procedural busts */
const GI = {outfit:'gi', o1:'#ff7a12', o2:'#1f4fbf'};
const ARMOR = {outfit:'armor', o1:'#f4f4ee', o2:'#1f3c8a', sh:'#e8c24a'};
const L = {
  yamcha:  {skin:'#f0c39a', hair:'yamcha', hc:'#15121b', ...GI, x:['scar']},
  chiaotzu:{skin:'#f7f0f0', hair:'none', outfit:'plain', o1:'#2f8a4a', o2:'#d23b2b', x:['cheeks','hat'], eye:'#222'},
  krillin: {skin:'#f3cba4', hair:'none', ...GI, x:['dots','nonose']},
  tien:    {skin:'#f0c39a', hair:'none', outfit:'tank', o1:'#2f8a4a', x:['thirdEye']},
  piccolo: {skin:'#5fae4a', hair:'turban', hc:'#f4f4f4', band:'#7a3fc0', outfit:'cape', o1:'#5a2a9a', x:['antennae','ears']},
  goku_ssj:{skin:'#f3c9a0', hair:'ssj', hc:'#ffe14a', bc:'#d4a800', eye:'#139e95', ...GI, aura:'#ffe14a'},
  vegeta:  {skin:'#f0c39a', hair:'vegeta', hc:'#ffe14a', bc:'#d4a800', eye:'#139e95', ...ARMOR, aura:'#ffe14a'},
  gohan:   {skin:'#f3c9a0', hair:'gohan', hc:'#ffe14a', bc:'#d4a800', eye:'#139e95', outfit:'gi', o1:'#5a2a9a', o2:'#3a1a6a', noemb:1, aura:'#ffe14a', bolts:1},

function U(id, rec){ const b = UNITS[id]; return rec && rec.ur && b.aw ? {...b, ...b.aw, rar:'UR', id} : {...b, id}; }
function typeMult(att, def){ return BEATS[att] === def ? 1.5 : BEATS[def] === att ? 0.75 : 1; }
function leadHits(l, u){ const t = l.to; return !!(t.all || t.type === u.type || (t.cls && t.cls === u.cls) || (t.cats && t.cats.some(c => u.cats.includes(c)))); }
function leadTarget(t){
  const p = [];
  if (t.all) p.push('All Types');
  if (t.type) p.push(`${t.type} Type`);
  if (t.cls) p.push(`${t.cls === 'S' ? 'Super' : 'Extreme'} Class`);
  if (t.cats) p.push(t.cats.map(c => `"${c}"`).join(' or ') + ' Category');
  return p.join(' or ');
}
function leadText(l){ return `${leadTarget(l.to)}${l.ki ? ` Ki +${l.ki} and` : ''} HP, ATK & DEF +${l.pct}%`; }
function saWord(m){ return m >= 5 ? 'mega-colossal' : m >= 3.5 ? 'immense' : m >= 3 ? 'supreme' : m >= 2.4 ? 'extreme' : 'huge'; }
function saText(sa){
  const e = sa.eff || {}, out = [`Causes ${saWord(sa.mult)} damage to ${e.all ? 'all enemies' : 'enemy'}`];
  if (e.atkUp) out.push(`raises ATK by ${e.atkUp}% (stacks)`);
  if (e.defUp) out.push(`raises DEF by ${e.defUp}% for 1 turn`);
  if (e.defDown) out.push(`lowers DEF by ${e.defDown}%`);
  if (e.stun) out.push(`${e.stun}% chance to stun`);
  if (e.heal) out.push(`recovers ${e.heal}% HP`);
  return out.join('; ');
}
function pasText(p){
  const o = [];
  if (p.atk || p.def) o.push([p.atk && `ATK +${p.atk}%`, p.def && `DEF +${p.def}%`].filter(Boolean).join(' and '));
  if (p.ki) o.push(`Ki +${p.ki} at start of turn`);
  if (p.crit) o.push(`${p.crit}% chance of a critical hit`);
  if (p.dodge) o.push(`${p.dodge}% chance to evade`);
  if (p.addAtk) o.push(`${p.addAtk}% chance of an additional attack that may become a Super Attack`);
  if (p.healSA) o.push(`recovers ${p.healSA}% HP when performing a Super Attack`);
  return o.join('; ');
}

const SAVE_KEY = 'dokkan-replica-v1';
function freshSave(){
  return {ds:100, zeni:5000, rank:1, exp:0, act:30, actAt:Date.now(),
    owned:{goku_ssj:{sa:1,n:1}, krillin:{sa:1,n:1}, piccolo:{sa:1,n:1}, tien:{sa:1,n:1}, yamcha:{sa:1,n:1}, chiaotzu:{sa:1,n:1}},
    team:['goku_ssj','krillin','piccolo','tien','yamcha','chiaotzu'], cleared:{}, medals:{nappa:0, frieza:0, cell:0}, daily:'', pulls:0};
}
function loadSave(){ try { const o = JSON.parse(localStorage.getItem(SAVE_KEY)); if (o && o.owned) return Object.assign(freshSave(), o); } catch (e) {} return freshSave(); }
function save(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
let S = loadSave();
const actMax = () => 30 + (S.rank - 1) * 3;
const expNeed = r => 50 + r * 40;
function syncAct(){
  const now = Date.now(), m = actMax();
  if (S.act >= m){ S.actAt = now; return; }
  const gain = Math.floor((now - S.actAt) / ACT_MS);
  if (gain > 0){ S.act = Math.min(m, S.act + gain); S.actAt += gain * ACT_MS; if (S.act >= m) S.actAt = now; }
}

function hud(){
  syncAct();
  $('#h-rank').textContent = S.rank;
  $('#h-xp').style.width = Math.min(100, S.exp / expNeed(S.rank) * 100) + '%';
  $('#h-act').textContent = `${S.act}/${actMax()}`;
  const left = S.act >= actMax() ? '' : Math.max(0, Math.ceil((ACT_MS - (Date.now() - S.actAt)) / 1000));
  $('#h-actt').textContent = left === '' ? 'FULL' : `+1 in ${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;

function toast(msg){
  document.querySelectorAll('.toast').forEach(t => t.remove());

/* ====================== summon ====================== */
function rollRarity(b, guarantee){
  const pool = guarantee ? RATES.filter(r => RANK[r[0]] >= 2) : RATES;
  let v = Math.random() * pool.reduce((a, r) => a + r[1], 0);
  for (const [k, w] of pool){ if ((v -= w) < 0) return k; }
  return pool.at(-1)[0];
}
function rollUnit(b, rar){
  if (rar === 'LR') return b.feat.find(id => UNITS[id].rar === 'LR');
  const ids = Object.keys(UNITS).filter(id => UNITS[id].rar === rar);
  const feat = ids.filter(id => b.feat.includes(id));
  return feat.length && Math.random() < 0.5 ? pick(feat) : pick(ids);
}
function pull(arg){
  const [bid, nStr] = arg.split(':'), n = +nStr, cost = n === 10 ? 50 : 5, b = BANNERS.find(x => x.id === bid);
  if (S.ds < cost){ toast(`You need ${cost} Dragon Stones. Clear quests or claim the login bonus.`); return; }
  S.ds -= cost; S.pulls += n;
  const res = [];
  for (let i = 0; i < n; i++){

/* ====================== quest run (board map) ====================== */
let Q = null, B = null;
function mkInst(id, rec, leads){
  const u = U(id, rec); let pct = 0, ki = 0;
  leads.forEach(l => { if (leadHits(l, u)){ pct += l.pct; ki += l.ki || 0; } });
  const m = 1 + pct / 100;
  return {id, u, lv:rec.sa || 1, hp:u.hp * m, atk:u.atk * m, def:u.def * m, lki:ki, ki:0, atkUp:0, defUp:0, done:false};
}
function startRun(si, fi){
  const st = STAGES[si], fr = FRIENDS[fi]; syncAct();
  if (S.act < st.act){ toast(`Not enough ACT. You need ${st.act}; ACT refills by 1 every minute.`); return; }
  const team = S.team.filter(id => S.owned[id]);
  if (team.length < 2){ toast('Put at least 2 characters in your team.'); return; }
  S.act -= st.act; if (S.act < actMax() && S.act + st.act >= actMax()) S.actAt = Date.now(); save(); hud();
  const leads = [U(team[0], S.owned[team[0]]).lead, U(fr.id, fr.rec).lead];
  const units = team.map(id => mkInst(id, S.owned[id], leads));
  const f = mkInst(fr.id, fr.rec, leads); f.friend = true; units.push(f);
  let g = 0;
  const tiles = [...st.tiles].map(k => ({k, g: k === 'b' ? g++ : -1}));
  const max = Math.round(units.reduce((a, x) => a + x.hp, 0));
  Q = {st, si, fr, units, max, hp:max, gauge:0, senzu:0, pos:0, tiles, done:new Set([0]), loot:{zeni:0, medals:0, ds:0}, busy:false, spin:null, n:1};
  closeModal(); buildRun();
}
function mapPts(n){
  const per = 4, rows = Math.ceil(n / per), H = rows * 104 + 90;
  return {H, pts: Array.from({length:n}, (_, i) => { const r = Math.floor(i / per), c = i % per, col = r % 2 ? per - 1 - c : c; return [12.5 + col * 25, H - 56 - r * 104]; })};
}
function tileInner(t){

    case 'z': return '<span class="ic-coin">Z</span>';
    case 'i': return '<span class="ic-bean"></span>';
    case 'h': return '<span class="ic-cross"></span>';
    case 'm': return `<span class="ic-medal" style="--mc:${MEDALS[Q.st.medal].c}"></span>`;
    case 'd': return '<span class="ic-ds"></span>';

}
function buildRun(){

function runHud(){

  $('#r-senzu').innerHTML = `<span class="ic-bean" style="display:inline-block;width:10px;height:15px;vertical-align:-3px"></span> ×${Q.senzu}`;
}
function placeToken(instant){
  const t = $('#token'), p = Q.pts[Q.pos];
  if (instant) t.style.transition = 'none';
  t.style.left = p[0] + '%'; t.style.top = p[1] + 'px';
  t.style.animation = 'none'; void t.offsetWidth; t.style.animation = '';

function startSpin(){

async function evt(title, text){

async function roll(){
  if (!Q || Q.busy || !Q.spin) return;
  Q.busy = true; stopSpin();
  const n = Q.n = 1 + rnd(6); $('#dice-n').textContent = n; $('#dice').disabled = true;
  $('#ctrl-t').textContent = `Moving ${n}`;
  await wait(350);

    if (Q.pos >= Q.tiles.length - 1) break;
    Q.pos++; placeToken(); await wait(260);
    const t = Q.tiles[Q.pos];
    if (t.k === 'B' || (t.k === 'b' && !Q.done.has(Q.pos))) break;

}
async function land(){
  const p = Q.pos, t = Q.tiles[p];
  if (Q.done.has(p) && t.k !== 'B') return;
  if (t.k !== 'b' && t.k !== 'B'){ Q.done.add(p); $('#tile' + p).classList.add('done'); }
  switch (t.k){
    case 'z': { const z = 1000 + rnd(5) * 500; Q.loot.zeni += z; await evt('ZENI', `+${fmt(z)} Zeni`); break; }
    case 'i': Q.senzu++; await evt('ITEM', 'Got a Senzu Bean!'); break;
    case 'h': { const h = Q.max * 0.3; Q.hp = Math.min(Q.max, Q.hp + h); await evt('RECOVERY', `Recovered ${fmt(h)} HP`); break; }
    case 'm': Q.loot.medals++; await evt('MEDAL', `Got a ${MEDALS[Q.st.medal].name}!`); break;
    case 'd': if (!S.cleared[Q.st.id]){ Q.loot.ds++; await evt('DRAGON STONE', 'Found a Dragon Stone!'); } else await evt('EMPTY', 'Already collected'); break;
    case 'b': { await evt('ENEMY!', 'Battle start'); const r = await fight(Q.st.groups[t.g], false); if (r === 'win' && Q){ Q.done.add(p); $('#tile' + p).classList.add('done'); } break; }
    case 'B': { await evt('WARNING!', 'Boss ahead'); const r = await fight(Q.st.boss, true); if (r === 'win' && Q) stageClear(); break; }
  }

}
function endRun(){ stopSpin(); document.querySelectorAll('#run,#battle').forEach(e => e.remove()); if (B && B.resolve) B.resolve('quit'); B = null; Q = null; closeModal(); render(); }

function stageClear(){

function renderFoot(){

}
function flood(i0){
  const bd = B.board, t = bd[i0], seen = new Set([i0]), q = [i0];
  while (q.length){
    const i = q.pop(), r = Math.floor(i / COLS), c = i % COLS;

      const nr = r + dr, nc = c + dc; if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) continue;
      const j = nr * COLS + nc; if (seen.has(j)) continue;
      if (bd[j] === t || (t !== 'RBW' && bd[j] === 'RBW')){ seen.add(j); q.push(j); }
    }

function kiGain(x, chain){ return chain.reduce((a, i) => a + (B.board[i] === x.u.type ? 2 : 1), 0); }
function preview(i){
  document.querySelectorAll('.sp.hl').forEach(s => s.classList.remove('hl'));

  if (i < 0 || !B || B.busy || B.order.length > 2) return;

function collapse(chain){

    let r = ROWS - 1;

}
function slotLinks(rot){ return rot.map((x, k) => { const nb = [rot[k - 1], rot[k + 1]].filter(Boolean); return x.u.links.filter(l => nb.some(y => y.u.links.includes(l))); }); }
const linkSum = (ls, key) => ls.reduce((a, l) => a + (LINKS[l][key] || 0), 0);
function center(el){ const b = $('#battle'), br = b.getBoundingClientRect(), r = el.getBoundingClientRect(); return [r.left - br.left + r.width / 2, r.top - br.top + b.scrollTop + r.height / 2, r]; }
function popAt(el, text, cls){
  if (!el) return; const [x, y] = center(el);
  const p = document.createElement('div'); p.className = 'pop ' + (cls || ''); p.textContent = text; p.style.left = x + 'px'; p.style.top = (y - 20) + 'px';
  $('#battle').append(p); setTimeout(() => p.remove(), 1200);
}
async function fx(text, cls){ const b = $('#battle'); if (!b) return; const e = document.createElement('div'); e.className = 'banner-fx ' + (cls || ''); e.innerHTML = text; b.append(e); await wait(1000); e.remove(); }
function heal(pct){ const a = Q.max * pct / 100; Q.hp = Math.min(Q.max, Q.hp + a); popAt($('#b-hpw'), `+${fmt(a)}`, 'info small'); }

async function beginTurn(){
  if (!B) return;
  B.rot = rotation(B.turn); B.links = slotLinks(B.rot);
  B.rot.forEach((x, k) => { x.ki = Math.min(maxKi(x.u), x.lki + (x.u.pas.ki || 0) + linkSum(B.links[k], 'ki')); x.defUp = 0; x.done = false; });
  B.order = []; B.sel = 0; B.dokkan = false; B.marks = [[], [], []];
  B.enemies.forEach((e, ei) => {
    e.stunned = false; if (e.hp <= 0) return;
    const n = e.hits[0] + rnd(e.hits[1] - e.hits[0] + 1);
    const sup = e.boss ? B.turn % 3 === 2 : Math.random() < 0.25;
    for (let h = 0; h < n; h++) B.marks[rnd(3)].push({ei, sup: sup && h === 0});
  });
  renderFoes(); renderOrder(); renderMates(); renderBoard(); renderFoot();
  if (Q.gauge >= 100){ await dokkanMode(); if (!B) return; }
  const hitPos = B.marks.map((m, p) => m.length ? p + 1 : 0).filter(Boolean);
  log(hitPos.length ? `Enemy will strike attack position${hitPos.length > 1 ? 's' : ''} ${hitPos.join(' and ')}. Choose your order.` : 'Choose a fighter, then tap a ki sphere.');
  B.busy = false; renderFoot();
}

async function dokkanMode(){
  B.busy = true; Q.gauge = 0;
  await fx('DOKKAN<br>MODE!', 'dok');
  const ov = document.createElement('div'); ov.className = 'dokkan';
  ov.innerHTML = `<h3>DOKKAN!</h3><button class="tap" aria-label="Tap rapidly">TAP!</button><div class="meter"><i></i></div><div class="sub" style="margin:0;color:#fff">Tap as fast as you can!</div>`;
  $('#battle').append(ov);
  let taps = 0; const meter = ov.querySelector('.meter i');
  ov.querySelector('.tap').addEventListener('pointerdown', () => { taps++; meter.style.width = Math.min(100, taps * 4) + '%'; });
  await new Promise(r => setTimeout(r, 3000));
  ov.remove();
  const power = B.rot.reduce((a, x) => a + x.atk, 0) * (1.5 + Math.min(taps, 25) * 0.06);
  for (const [i, e] of B.enemies.entries()){
    if (e.hp <= 0) continue;
    const d = Math.round(Math.max(1, power - e.def)); e.hp = Math.max(0, e.hp - d);
    popAt($('#foe' + i), fmt(d), 'big');
  }
  B.board = B.board.map(() => 'RBW'); B.dokkan = true;
  renderFoes(); renderBoard(); renderFoot();
  log(`Dokkan Mode! ${taps} taps. Every ki sphere is rainbow and ATK +30% this turn.`);
  await wait(700);
  if (B.enemies.every(e => e.hp <= 0)) await battleWon();
}

async function tapSphere(i){
  if (!B || B.busy || B.order.length > 2) return;
  if (B.rot[B.sel].done) B.sel = B.rot.findIndex(x => !x.done);
  B.busy = true; preview(-1);
  const slot = B.sel, x = B.rot[slot], chain = flood(i), gain = kiGain(x, chain);
  if (!B.dokkan) Q.gauge = Math.min(100, Q.gauge + chain.length * 2.2);
  const sp = document.querySelectorAll('.sp'), target = $('#mate' + slot), [tx, ty] = center(target);
  chain.forEach((j, n) => {
    const [cx, cy, r] = center(sp[j]); const d = document.createElement('div');
    d.className = `fly sp s-${B.board[j]}`; d.style.cssText = `left:${cx - r.width / 2}px;top:${cy - r.height / 2}px;width:${r.width}px;height:${r.height}px;transition-delay:${n * 18}ms`;
    $('#battle').append(d); sp[j].classList.add('take');
    requestAnimationFrame(() => requestAnimationFrame(() => { d.style.transform = `translate(${tx - cx}px,${ty - cy}px) scale(.35)`; d.style.opacity = '.2'; }));
    setTimeout(() => d.remove(), 500 + n * 18);
  });
  await wait(380 + Math.min(chain.length, 12) * 18);
  const fresh = collapse(chain); renderBoard(fresh);
  x.ki = Math.min(maxKi(x.u), x.ki + gain); x.done = true; B.order.push(slot);
  renderMates(); renderOrder(); renderFoot();
  await wait(160);
  const won = await unitAttack(x, slot);
  if (!B) return;
  if (won){ await battleWon(); return; }
  const alive = await enemyStrikes(B.order.length - 1, x, slot);
  if (!B) return;
  if (!alive){ const ok = await askRevive(); if (!ok) return; }
  if (B.order.length >= 3){ B.turn++; await wait(250); beginTurn(); return; }
  B.sel = B.rot.findIndex(y => !y.done);
  renderMates(); renderOrder(); renderFoot();
  log(`Next: choose who attacks in position ${B.order.length + 1}.`);
  B.busy = false; renderFoot();
}

async function unitAttack(x, slot){
  const u = x.u, links = B.links[slot];
  let ti = B.enemies[B.tgt] && B.enemies[B.tgt].hp > 0 ? B.tgt : B.enemies.findIndex(e => e.hp > 0); B.tgt = ti;
  let kind = 'normal', sa = null;
  if (u.usa && x.ki >= 18){ kind = 'ultra'; sa = u.usa; } else if (x.ki >= 12){ kind = 'super'; sa = u.sa; }
  if (sa && sa.eff && sa.eff.atkUp) x.atkUp += sa.eff.atkUp;
  const hit = async (k, s, label) => {
    const kiM = k === 'normal' ? 1 + x.ki * 0.06 : 1.5 + Math.max(0, x.ki - 12) * (0.5 / 12);
    const saM = s ? s.mult + 0.05 * (x.lv - 1) : 1;
    const atk = x.atk * (1 + ((u.pas.atk || 0) + linkSum(links, 'atk') + x.atkUp + (B.dokkan ? 30 : 0)) / 100) * kiM * saM;
    const targets = s && s.eff && s.eff.all ? B.enemies.map((e, i) => i).filter(i => B.enemies[i].hp > 0) : [ti];
    if (s) await cutin(x, s, k);
    else await wait(120);
    if (!B) return;
    const [mx] = center($('#mate' + slot));
    for (const i of targets){
      const e = B.enemies[i]; if (e.hp <= 0) continue;
      const crit = Math.random() * 100 < (u.pas.crit || 0), tm = typeMult(u.type, e.type), edef = e.def * (1 - e.defDown / 100);
      const dmg = Math.max(1, Math.round((atk * tm * (crit ? 1.875 : 1) - (crit ? 0 : edef)) * (0.97 + Math.random() * 0.06)));
      const fe = $('#foe' + i), [fx2, fy] = center(fe.querySelector('.foe-pt')), [, my] = center($('#mate' + slot));
      const bm = document.createElement('div'); bm.className = 'beam'; const dx = fx2 - mx, dy = fy - my;
      bm.style.cssText = `left:${mx}px;top:${my}px;width:${Math.hypot(dx, dy)}px;transform:rotate(${Math.atan2(dy, dx)}rad);--bc:${TCOL[u.type]}`;
      $('#battle').append(bm); setTimeout(() => bm.remove(), 500);
      await wait(200);
      e.hp = Math.max(0, e.hp - dmg);
      fe.classList.remove('hit'); void fe.offsetWidth; fe.classList.add('hit');
      popAt(fe.querySelector('.foe-pt'), fmt(dmg), crit ? 'crit' : k === 'ultra' ? 'big' : '');
      if (label) popAt(fe.querySelector('.foe-nm'), label, 'info small');
      else if (crit) popAt(fe.querySelector('.foe-nm'), 'CRITICAL!', 'info');
      else if (tm > 1) popAt(fe.querySelector('.foe-nm'), 'EFFECTIVE!', 'info small');
      else if (tm < 1) popAt(fe.querySelector('.foe-nm'), 'Resisted', 'bad small');
      if (s){
        const f = s.eff || {};
        if (f.defDown) e.defDown = Math.min(60, e.defDown + f.defDown);
        if (f.stun && Math.random() * 100 < f.stun && e.hp > 0){ e.stunned = true; popAt(fe.querySelector('.foe-pt'), 'STUNNED', 'info'); }
      }
      log(`${u.name} ${s ? `used ${s.name}` : 'attacked'} for ${fmt(dmg)} damage.`);
    }
    if (s){ const f = s.eff || {}; if (f.defUp) x.defUp = f.defUp; if (f.heal) heal(f.heal); if (u.pas.healSA) heal(u.pas.healSA); }
    renderFoes(); renderOrder(); renderFoot();
    await wait(380);
  };
  await hit(kind, sa);
  if (!B) return false;
  if (B.enemies.some(e => e.hp > 0) && u.pas.addAtk && Math.random() * 100 < u.pas.addAtk){
    ti = B.enemies[ti].hp > 0 ? ti : B.enemies.findIndex(e => e.hp > 0);
    const sup = Math.random() < 0.5;
    await hit(sup ? 'super' : 'normal', sup ? u.sa : null, 'ADDITIONAL!');
  }
  return B && B.enemies.every(e => e.hp <= 0);
}

async function cutin(x, s, k){
  const el = document.createElement('div'); el.className = `cutin t-${x.u.type}${k === 'ultra' ? ' ua' : ''}`;
  el.innerHTML = `<div class="band"><span class="ca">${art(x.u.look, x.u.type)}</span><span class="ct"><small>${k === 'ultra' ? 'ULTRA SUPER ATTACK' : 'SUPER ATTACK'}</small><b>${s.name}</b></span></div>`;
  $('#battle').append(el); el.style.top = $('#battle').scrollTop + 'px';
  await wait(1100); el.remove();
}

async function enemyStrikes(pos, x, slot){
  for (const m of B.marks[pos]){
    const e = B.enemies[m.ei];
    if (!e || e.hp <= 0 || e.stunned) continue;
    await wait(180);
    const fe = $('#foe' + m.ei);
    if (m.sup){ await cutin({u:{type:e.type, look:e.look}}, e.sa, 'super'); if (!B) return true; }
    fe.classList.remove('lunge'); void fe.offsetWidth; fe.classList.add('lunge');
    await wait(220);
    const me = $('#mate' + slot);
    if (Math.random() * 100 < (x.u.pas.dodge || 0)){ popAt(me, 'DODGE!', 'info'); log(`${x.u.name} evaded ${e.name}'s attack!`); await wait(350); continue; }
    const tmD = BEATS[e.type] === x.u.type ? 1.5 : BEATS[x.u.type] === e.type ? 0.5 : 1;
    const raw = e.atk * (m.sup ? e.sa.mult : 1) * tmD;
    const def = x.def * (1 + ((x.u.pas.def || 0) + linkSum(B.links[slot], 'def') + x.defUp) / 100);
    const dmg = Math.round(Math.max(raw * 0.1, raw - def));
    Q.hp = Math.max(0, Q.hp - dmg);
    me.classList.remove('hit'); void me.offsetWidth; me.classList.add('hit');
    popAt(me, `−${fmt(dmg)}`, 'bad');
    log(`${e.name}${m.sup ? ` used ${e.sa.name} and` : ''} hit ${x.u.name} for ${fmt(dmg)}${tmD > 1 ? ' (weak to it!)' : tmD < 1 ? ' (resisted)' : ''}.`);
    renderFoot(); await wait(380);
    if (Q.hp <= 0) return false;
  }
  return true;
}

function askRevive(){
  return new Promise(res => {
    B.busy = true; B.revive = res;
    modal(`<h3 style="text-align:center;color:var(--red);font-size:40px">DEFEATED</h3><p style="text-align:center">Use 1 Dragon Stone to revive with full HP and keep fighting? You have ${S.ds}.</p>
      <div class="row"><button class="btn gray" data-act="giveup2">Give up</button><button class="btn" data-act="revive" ${S.ds >= 1 ? '' : 'disabled'}>Revive <span class="cost">1</span></button></div>`);
  });
}

async function battleWon(){
  B.busy = true;
  B.enemies.forEach((e, i) => { const f = $('#foe' + i); if (f) f.classList.add('down'); });
  await fx(B.boss ? 'BOSS<br>DEFEATED!' : 'CLEAR!', 'dok');
  const res = B.resolve; $('#battle').remove(); B = null; runHud(); res('win');
}

/* ====================== actions ====================== */
const ACT = {
  tab(a){ tab = a; render(); },
  daily(){ if (S.daily === today()) return; S.daily = today(); S.ds += 5; save(); render(); toast('Login bonus: +5 Dragon Stones'); },
  locked(){ toast('Clear the previous stage first.'); },
  friends(a){ closeModal(); showFriends(+a); },
  go(a){ const [si, fi] = a.split(':').map(Number); startRun(si, fi); },
  dice(){ roll(); },
  giveup(){ modal(`<h3>Give up the quest?</h3><p>You lose the ACT you spent and anything picked up on this run.</p><div class="row"><button class="btn gray" data-act="close">Keep going</button><button class="btn" data-act="giveup2">Give up</button></div>`); },
  giveup2(){ if (B && B.revive){ const r = B.revive; B.revive = null; r(false); } endRun(); toast('Quest abandoned.'); },
  revive(){ if (S.ds < 1 || !B) return; S.ds--; save(); hud(); Q.hp = Q.max; closeModal(); renderFoot(); const r = B.revive; B.revive = null; B.busy = false; popAt($('#b-hpw'), 'REVIVED!', 'info'); r(true); },
  senzu(){ if (!B || B.busy || !Q.senzu) return; Q.senzu--; heal(60); renderFoot(); log('Ate a Senzu Bean. HP restored!'); },
  sel(a){ if (!B || B.busy) return; const k = +a; if (B.rot[k].done) return; B.sel = k; renderMates(); },
  tgt(a){ if (!B || B.busy) return; if (B.enemies[+a].hp > 0){ B.tgt = +a; renderFoes(); } },
  pull(a){ pull(a); },
  closesummon(){ document.querySelectorAll('.summon').forEach(s => s.remove()); },
  detail(a){ showDetail(a); },
  close(){ closeModal(); },
  none(){},
  slot(a){ showPicker(+a); },
  assign(id){
    const i = pickSlot, cur = S.team[i], at = S.team.indexOf(id);
    if (at >= 0 && cur) S.team[at] = cur; else if (at >= 0) S.team.splice(at, 1);
    if (i >= S.team.length) S.team.push(id); else S.team[i] = id;
    S.team = S.team.filter(Boolean); save(); closeModal(); render();
  },
  unassign(){ S.team.splice(pickSlot, 1); save(); closeModal(); render(); },
  makelead(id){ S.team = [id, ...S.team.filter(t => t !== id)].slice(0, 6); save(); closeModal(); tab = 'team'; render(); toast(`${UNITS[id].name} is now your leader.`); },
  awaken(id){
    const b = UNITS[id], r = S.owned[id];
    if (!r || r.ur || (S.medals[b.medal] || 0) < AWAKEN.medals || S.zeni < AWAKEN.zeni) return;
    S.medals[b.medal] -= AWAKEN.medals; S.zeni -= AWAKEN.zeni; r.ur = true; save();
    closeModal(); render();
    const a = document.createElement('div'); a.className = 'awk'; a.innerHTML = 'DOKKAN<br>AWAKENING!'; $('#app').append(a);
    setTimeout(() => { a.remove(); showDetail(id); }, RM ? 400 : 1400);
  },
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  const f = ACT[t.dataset.act]; if (f) f(t.dataset.arg);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !(B && B.revive)) closeModal(); });

function start(data){ if (data && data.tab) tab = data.tab; render(); }
if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({tab}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
