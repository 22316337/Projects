<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ki Burst</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A small browser battle game in the style of Dokkan Battle: link ki spheres, fire super attacks, clear stages and summon fighters from banners.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Chakra+Petch:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-shaped game column. Screens swap inside it; battle and summons cover it. Single dark arena look by design. */
:root{
  --bg:#0d0a1c; --panel:#191433; --panel2:#231c47; --ink:#f5f1ff; --muted:#a69ec9; --line:#332a5e;
  --gold:#ffc93c; --hot:#ff5a2a; --good:#3ee08f;
  --agl:#2f86ff; --teq:#1fc067; --int:#a64dff; --str:#ff3d4d; --phy:#ff9f1c;
  --f-d:"Bangers", Impact, "Arial Black", system-ui, sans-serif;
  --f-b:"Chakra Petch", system-ui, -apple-system, "Segoe UI", sans-serif;
  --gut-l:max(16px, env(safe-area-inset-left, 0px)); --gut-r:max(16px, env(safe-area-inset-right, 0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:14px;line-height:1.45;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app{position:relative;max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;
  background:radial-gradient(ellipse 120% 60% at 50% -10%, #2c1e63 0%, transparent 65%), var(--bg);
  border-left:1px solid var(--line);border-right:1px solid var(--line)}

/* header */
.top{display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:var(--gut-l);padding-right:var(--gut-r);border-bottom:1px solid var(--line)}
.logo{font-family:var(--f-d);font-size:30px;letter-spacing:.04em;line-height:1;margin:0;
  background:linear-gradient(180deg,#fff6c9 0%,var(--gold) 45%,var(--hot) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 0 #5a1a00)}
.logo small{display:block;font-family:var(--f-b);font-size:9px;letter-spacing:.24em;color:var(--muted);-webkit-text-fill-color:var(--muted);filter:none;margin-top:2px}
.spacer{flex:1}
.stones{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:4px 12px 4px 8px;font-weight:700;font-variant-numeric:tabular-nums}
.gem{width:14px;height:14px;transform:rotate(45deg);border-radius:3px;background:linear-gradient(135deg,#9ff3ff,#3b8bff 55%,#a64dff);box-shadow:0 0 8px #5ab0ff99;flex:none}
.daily{border:0;border-radius:99px;padding:5px 12px;font-weight:700;font-size:12px;background:var(--gold);color:#2a1600;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-2px)}}

/* main area */
#screen{flex:1;overflow-y:auto;padding-block:16px 24px;padding-left:var(--gut-l);padding-right:var(--gut-r);display:flex;flex-direction:column;gap:14px}
#screen>*{flex-shrink:0}
h2.sec{font-family:var(--f-d);font-weight:400;font-size:26px;letter-spacing:.04em;margin:0;line-height:1}
.sec-sub{color:var(--muted);margin:-6px 0 0}

/* bottom nav */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:#100c24;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs button{border:0;background:none;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--gold)}

/* type badges */
.tb{display:inline-grid;place-items:center;font-style:normal;font-size:10px;font-weight:700;letter-spacing:.04em;padding:1px 5px;border-radius:5px;color:#fff;background:var(--tc);line-height:1.4;vertical-align:1px}
.t-AGL{--tc:var(--agl)} .t-TEQ{--tc:var(--teq)} .t-INT{--tc:var(--int)} .t-STR{--tc:var(--str)} .t-PHY{--tc:var(--phy)}

/* buttons */
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;letter-spacing:.03em;background:var(--panel2);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.go{background:linear-gradient(180deg,#ffe07a,var(--gold) 50%,#e89a00);color:#2a1600;border-color:#ffe9a0;box-shadow:0 3px 0 #8a5200}
.btn.hot{background:linear-gradient(180deg,#ff8a5a,var(--hot) 55%,#c02a00);color:#fff;border-color:#ffb08a;box-shadow:0 3px 0 #6e1800}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn:not(:disabled):active{transform:translateY(2px);box-shadow:none}
.cost{display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.cost::before{content:"";width:10px;height:10px;transform:rotate(45deg);border-radius:2px;background:linear-gradient(135deg,#9ff3ff,#3b8bff 55%,#a64dff)}

/* type wheel / how to play */
.howto{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.howto summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center}
.howto summary::after{content:"+";font-size:18px;color:var(--muted)}
.howto[open] summary::after{content:"–"}
.howto ul{margin:10px 0 0;padding-left:18px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.howto b{color:var(--ink)}
.wheel{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:10px;font-size:12px;color:var(--muted)}

/* stage cards */
.stage{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.stage.locked{opacity:.6}
.stage-art{position:relative;height:118px}
.stage-art>svg{position:absolute;inset:0;width:100%;height:100%}
.boss-port{position:absolute;right:14px;bottom:-26px;width:84px;height:84px;border-radius:50%;overflow:hidden;border:3px solid var(--panel);box-shadow:0 0 0 2px var(--tc)}
.boss-port svg{width:100%;height:100%;display:block}
.stage-tag{position:absolute;left:14px;top:12px;font-family:var(--f-d);font-size:15px;letter-spacing:.08em;background:#0009;padding:2px 9px;border-radius:6px}
.stage-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px}
.stage-body h3{font-family:var(--f-d);font-weight:400;font-size:24px;letter-spacing:.03em;margin:0;line-height:1;max-width:calc(100% - 96px)}
.stage-body p{margin:0;color:var(--muted)}
.diff{color:var(--gold);letter-spacing:2px}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:600}
.clear-chip{font-size:11px;font-weight:700;color:var(--good);border:1px solid currentColor;border-radius:99px;padding:0 8px}

/* unit cards */
.uc{position:relative;display:block;width:100%;aspect-ratio:1;max-width:100%;padding:0;border-radius:12px;border:3px solid var(--rc);background:var(--panel);overflow:hidden}
.uc svg{display:block;width:100%;height:100%}
.uc .tb{position:absolute;left:3px;top:3px}
.uc .rb{position:absolute;left:4px;bottom:1px;font-family:var(--f-d);font-weight:400;font-size:18px;letter-spacing:.04em;color:var(--rc2,var(--rc));-webkit-text-stroke:1px #000;line-height:1.1}
.uc .lv{position:absolute;right:3px;bottom:3px;font-size:10px;font-weight:700;background:#000b;border-radius:5px;padding:0 4px}
.uc .lead{position:absolute;right:3px;top:3px;font-size:10px;font-weight:700;background:var(--gold);color:#2a1600;border-radius:5px;padding:0 4px}
.uc.unknown svg{filter:brightness(.05) saturate(0)}
.uc.unknown::after{content:"?";position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-d);font-size:34px;color:var(--muted)}
.r-R{--rc:#b5794a} .r-SR{--rc:#c9d3e3} .r-SSR{--rc:var(--gold)}
.r-UR{--rc:#e46bff;--rc2:#ffb3ff;border-color:transparent;background:linear-gradient(var(--panel),var(--panel)) padding-box,linear-gradient(135deg,#ffd76a,#ff6bd5,#7a5cff) border-box}
.r-LR{--rc:#fff;--rc2:#fff;border-color:transparent;background:linear-gradient(var(--panel),var(--panel)) padding-box,linear-gradient(120deg,#ff3d4d,#ff9f1c,#ffe14a,#1fc067,#2f86ff,#a64dff,#ff3d4d) border-box;background-size:100% 100%,300% 100%;animation:lr 3s linear infinite}
.r-LR .rb{background:linear-gradient(90deg,#ff7b7b,#ffe14a,#6bffb0,#6bb7ff,#d38bff);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:0;filter:drop-shadow(0 1px 0 #000)}
@keyframes lr{to{background-position:0 0,300% 0}}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.uc-name{font-size:11px;color:var(--muted);text-align:center;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* summon banners */
.banner{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--panel)}
.banner-art{position:relative;height:170px;background:radial-gradient(circle at 70% 40%,var(--b1),transparent 60%),linear-gradient(160deg,var(--b2),#0a0618)}
.banner-art .rays{position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 70% 45%,#ffffff14 0 6deg,transparent 6deg 18deg)}
.feat-main,.feat-sub{position:absolute;border-radius:14px;overflow:hidden;box-shadow:0 8px 24px #0008}
.feat-main{right:16px;top:14px;width:132px;height:142px;border:3px solid #fff}
.feat-sub{right:132px;top:58px;width:92px;height:98px;border:3px solid #ffffffaa}
.feat-main svg,.feat-sub svg{width:100%;height:100%;display:block}
.banner-title{position:absolute;left:14px;top:14px;max-width:46%}
.banner-title .kicker{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;background:var(--hot);padding:1px 7px;border-radius:4px}
.banner-title h3{font-family:var(--f-d);font-weight:400;font-size:28px;line-height:.95;margin:8px 0 0;letter-spacing:.03em;text-shadow:0 2px 0 #000}
.banner-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.banner-body p{margin:0;color:var(--muted)}
.rates{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.pull-row{display:grid;grid-template-columns:1fr 1.3fr;gap:10px}

/* team */
.lead-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.lead-box .k{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700}
.slot-empty{aspect-ratio:1;border-radius:12px;border:2px dashed var(--line);background:none;display:grid;place-items:center;color:var(--muted);font-size:26px;width:100%}
.stats-row{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.stats-row b{color:var(--ink);font-variant-numeric:tabular-nums}

/* modal */
.modal-bg{position:absolute;inset:0;z-index:60;background:#05030ccc;display:grid;place-items:center;padding-block:16px;padding-left:var(--gut-l);padding-right:var(--gut-r)}
.modal{width:100%;max-width:420px;max-height:100%;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;animation:pop .2s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.modal h3{margin:0;font-family:var(--f-d);font-weight:400;font-size:26px;letter-spacing:.03em;line-height:1}
.modal .row{display:flex;gap:10px;flex-wrap:wrap}
.modal .row .btn{flex:1}
.detail-hd{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;align-items:center}
.detail-hd .uc{border-radius:14px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.kv div{background:var(--panel2);border-radius:10px;padding:6px 4px}
.kv small{display:block;font-size:10px;letter-spacing:.14em;color:var(--muted)}
.kv b{font-variant-numeric:tabular-nums}
.skill{border-left:3px solid var(--tc,var(--gold));padding:2px 0 2px 10px}
.skill .k{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
.skill .n{font-weight:700}
.skill p{margin:2px 0 0;color:var(--muted);font-size:13px}
.title-sm{color:var(--muted);font-size:12px}
.cats{display:flex;gap:6px;flex-wrap:wrap}
.cats span{font-size:11px;border:1px solid var(--line);border-radius:99px;padding:0 8px;color:var(--muted)}

/* toast */
.toast{position:absolute;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:#000d;border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-weight:600;max-width:calc(100% - 32px);text-align:center;animation:pop .2s}

/* ===== battle ===== */
.battle{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;background:var(--bg);overflow-y:auto;overflow-x:hidden}
.b-top{display:flex;align-items:center;gap:10px;padding-block:8px;padding-left:var(--gut-l);padding-right:var(--gut-r);font-size:12px;color:var(--muted);background:#0a0716;border-bottom:1px solid var(--line)}
.b-top b{color:var(--ink);font-family:var(--f-d);font-weight:400;font-size:18px;letter-spacing:.04em}
.b-top .retreat{border:1px solid var(--line);background:none;border-radius:8px;padding:3px 10px;font-size:12px;color:var(--muted)}
.b-enemy{position:relative;flex:1 0 auto;min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding-block:12px;padding-left:var(--gut-l);padding-right:var(--gut-r);overflow:hidden}
.b-enemy>svg.bg{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.b-enemy>*:not(.bg){position:relative;z-index:1}
.e-port{width:min(124px,16vh);height:min(124px,16vh);border-radius:50%;overflow:hidden;border:3px solid var(--tc);box-shadow:0 0 0 4px #0006,0 0 30px var(--tc)}
.e-port svg{display:block;width:100%;height:100%}
.e-port.hit{animation:shake .35s}
.e-port.down{animation:down .6s forwards}
.e-port.lunge{animation:lunge .3s}
@keyframes shake{20%{transform:translateX(-7px) rotate(-3deg);filter:brightness(2.2)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes down{to{transform:scale(.4) rotate(25deg);opacity:0;filter:brightness(3)}}
@keyframes lunge{50%{transform:translateY(16px) scale(1.12)}}
.e-info{width:min(100%,320px);display:flex;flex-direction:column;gap:4px;background:#0009;border-radius:10px;padding:6px 10px}
.e-name{display:flex;align-items:center;gap:6px;font-weight:700}
.e-name .boss{font-size:10px;font-weight:700;letter-spacing:.14em;background:var(--hot);border-radius:4px;padding:0 6px}
.e-status{display:flex;gap:6px;font-size:11px;min-height:16px}
.e-status span{background:#ffffff1a;border-radius:4px;padding:0 6px}
.bar{position:relative;height:10px;border-radius:99px;background:#000a;border:1px solid #ffffff22;overflow:hidden}
.bar>i{position:absolute;inset:0 auto 0 0;width:100%;border-radius:99px;transition:width .4s ease-out}
.bar.ehp>i{background:linear-gradient(90deg,#ff3d4d,#ff8a3d)}
.bar.thp>i{background:linear-gradient(90deg,#1fc067,#9cff5a)}
.bar.thp.low>i{background:linear-gradient(90deg,#ff3d4d,#ffb23d)}
.bar.gauge>i{background:linear-gradient(90deg,#2f86ff,#a64dff,#ff5ad5)}
.bar-lab{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.b-team{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding-block:10px 6px;padding-left:var(--gut-l);padding-right:var(--gut-r)}
.b-team .burst{grid-row:span 2;font-family:var(--f-d);font-weight:400;font-size:20px;letter-spacing:.06em;border:0;border-radius:12px;padding:8px 14px;background:#2a2350;color:var(--muted)}
.b-team .burst.ready{background:conic-gradient(from 0deg,#ff3d4d,#ff9f1c,#ffe14a,#1fc067,#2f86ff,#a64dff,#ff3d4d);color:#fff;text-shadow:0 2px 0 #000;animation:pulse 1s infinite}
.b-team .burst.on{background:var(--gold);color:#2a1600}
@keyframes pulse{50%{transform:scale(1.07)}}
.rot{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding-block:4px 10px;padding-left:var(--gut-l);padding-right:var(--gut-r)}
.slot{position:relative;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:5px;transition:transform .15s,opacity .2s}
.slot.active{border-color:var(--gold);box-shadow:0 0 0 2px #ffc93c44,0 0 18px #ffc93c55;transform:translateY(-3px)}
.slot.done{opacity:.5}
.slot.hit{animation:shake .35s}
.slot-hd{display:flex;gap:6px;align-items:center;min-width:0}
.slot-pt{width:40px;height:40px;flex:none;border-radius:8px;overflow:hidden;border:2px solid var(--rc)}
.slot-pt svg{display:block;width:100%;height:100%}
.slot-nm{min-width:0;font-size:11px;line-height:1.2}
.slot-nm b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ki{display:grid;grid-template-columns:repeat(12,1fr);gap:1px;height:7px}
.ki i{background:#ffffff1c;border-radius:1px}
.ki i.k1{background:var(--gold)}
.ki i.k2{background:linear-gradient(90deg,#ff5ad5,#6bd4ff)}
.ki-row{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.ki-row .sa{font-weight:700;color:var(--gold);letter-spacing:.06em}
.ki-row .sa.ultra{color:#ff8ae6}
.warn{position:absolute;top:-9px;right:-6px;display:flex;gap:3px}
.warn span{font-size:10px;font-weight:700;background:var(--str);color:#fff;border-radius:6px;padding:1px 6px;box-shadow:0 2px 0 #6a0010}
.warn span.sup{background:#000;color:var(--gold);border:1px solid var(--gold)}
.preview{position:absolute;left:50%;top:-12px;transform:translateX(-50%);font-family:var(--f-d);font-size:16px;color:#fff;-webkit-text-stroke:1px #000;pointer-events:none}
.board-wrap{padding-block:4px 8px;padding-left:var(--gut-l);padding-right:var(--gut-r)}
.board{--cell:min(56px,7.4vh);display:grid;grid-template-columns:repeat(6,1fr);gap:6px;width:min(100%,calc(var(--cell)*6 + 30px));margin:0 auto;background:#0007;border:1px solid var(--line);border-radius:14px;padding:8px}
.sp{aspect-ratio:1;max-width:100%;border-radius:50%;border:0;padding:0;position:relative;
  background:radial-gradient(circle at 34% 28%,#ffffffee 0 9%,transparent 11%),radial-gradient(circle at 50% 55%,var(--c) 0 42%,color-mix(in srgb,var(--c) 40%,#000) 78%);
  box-shadow:inset 0 -3px 6px #0006,0 0 8px color-mix(in srgb,var(--c) 50%,transparent);transition:transform .12s}
.sp::after{content:attr(data-l);position:absolute;inset:0;display:grid;place-items:center;font-size:10px;font-weight:700;color:#ffffffa0}
.s-AGL{--c:var(--agl)} .s-TEQ{--c:var(--teq)} .s-INT{--c:var(--int)} .s-STR{--c:var(--str)} .s-PHY{--c:var(--phy)}
.s-RBW{--c:#ffffff;background:radial-gradient(circle at 34% 28%,#ffffffee 0 9%,transparent 11%),conic-gradient(#ff3d4d,#ff9f1c,#ffe14a,#1fc067,#2f86ff,#a64dff,#ff3d4d)}
.sp.hl{transform:scale(1.12);box-shadow:0 0 0 2px #fff,0 0 14px var(--c)}
.sp.take{animation:take .26s forwards}
.sp.new{animation:drop .3s ease-out}
@keyframes take{to{transform:scale(.1) translateY(-30px);opacity:0}}
@keyframes drop{from{transform:translateY(-40px);opacity:0}}
.b-log{min-height:34px;padding-block:2px 10px;padding-left:var(--gut-l);padding-right:var(--gut-r);font-size:12px;color:var(--muted);text-align:center}
.battle.bursting .board{box-shadow:0 0 0 2px var(--gold),0 0 30px #ffc93c66}
.battle.bursting .b-enemy::after{content:"";position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 50% 50%,#ffe14a22 0 5deg,transparent 5deg 15deg);animation:spin 6s linear infinite;z-index:0}
@keyframes spin{to{transform:rotate(1turn)}}
.pop-n{position:absolute;z-index:5;font-family:var(--f-d);font-size:36px;letter-spacing:.02em;color:#fff;-webkit-text-stroke:1.5px #1a0a00;text-shadow:0 3px 0 #000;pointer-events:none;animation:float 1.1s ease-out forwards;white-space:nowrap}
.pop-n.crit{color:#ffe14a;font-size:44px}
.pop-n.big{font-size:48px;color:#ffd0f5}
.pop-n.small{font-size:20px}
.pop-n.bad{color:#ff6b6b;font-size:24px}
.pop-n.info{color:#9fe8ff;font-size:22px}
@keyframes float{0%{transform:translate(-50%,10px) scale(.6);opacity:0}15%{transform:translate(-50%,0) scale(1.1);opacity:1}70%{opacity:1}100%{transform:translate(-50%,-34px) scale(1);opacity:0}}
.flash{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden;pointer-events:none;
  background:radial-gradient(circle,color-mix(in srgb,var(--tc) 65%,#000) 0%,#05030c 70%);animation:flashIn 1.1s forwards}
.flash::before{content:"";position:absolute;inset:-50%;background:repeating-conic-gradient(from 0deg,#ffffff1c 0 4deg,transparent 4deg 12deg);animation:spin 2s linear infinite}
.flash.ultra{background:radial-gradient(circle,#ff7ad9 0%,#3a0a5e 45%,#05030c 75%)}
.fl-art{position:relative;width:180px;height:180px;border-radius:24px;overflow:hidden;border:4px solid #fff;animation:slide 1.1s ease-out}
.fl-art svg{display:block;width:100%;height:100%}
.fl-txt{position:relative;text-align:center;padding-inline:16px}
.fl-txt small{display:block;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#fff}
.fl-txt b{font-family:var(--f-d);font-weight:400;font-size:44px;line-height:1;letter-spacing:.03em;color:#fff;-webkit-text-stroke:1.5px #000;text-shadow:0 4px 0 #000}
@keyframes flashIn{0%{opacity:0}10%{opacity:1}85%{opacity:1}100%{opacity:0}}
@keyframes slide{from{transform:translateX(-120%) skewX(-10deg)}35%{transform:translateX(0)}}
.wave-ban{position:absolute;inset:0;z-index:6;display:grid;place-items:center;font-family:var(--f-d);font-size:56px;letter-spacing:.06em;color:#fff;-webkit-text-stroke:2px #000;text-shadow:0 4px 0 #000;pointer-events:none;animation:flashIn 1s forwards}
.wave-ban.boss{color:var(--hot)}

/* summon overlay */
.summon{position:absolute;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding-block:20px;padding-left:var(--gut-l);padding-right:var(--gut-r);background:radial-gradient(circle at 50% 40%,#2a1a66,#05030c 70%);overflow-y:auto}
.orb{width:150px;height:150px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#fff 0 8%,var(--oc) 30%,#000 90%);box-shadow:0 0 50px var(--oc),0 0 120px var(--oc);animation:orb 1.2s ease-in-out infinite}
.orb.LR,.orb.UR{background:radial-gradient(circle at 35% 30%,#fff 0 8%,transparent 30%),conic-gradient(#ff3d4d,#ff9f1c,#ffe14a,#1fc067,#2f86ff,#a64dff,#ff3d4d);animation:orb 1.2s ease-in-out infinite,spin 3s linear infinite}
@keyframes orb{50%{transform:scale(1.08)}}
.summon .hint{color:var(--muted);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:12px}
.res-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;width:100%;max-width:440px}
.res-grid.one{grid-template-columns:minmax(0,160px);justify-content:center}
.res{display:flex;flex-direction:column;gap:3px;animation:reveal .35s both}
.res .tag{font-size:10px;font-weight:700;text-align:center;color:var(--good)}
.res .tag.dup{color:var(--muted)}
@keyframes reveal{from{transform:rotateY(90deg) scale(.8);opacity:0}}
.summon h3{margin:0;font-family:var(--f-d);font-weight:400;font-size:34px;letter-spacing:.05em}

@media (max-width:400px){ .banner-art{height:150px} .feat-main{width:110px;height:120px} .feat-sub{right:112px;width:78px;height:84px;top:52px} .fl-txt b{font-size:36px} }
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important} .flash,.wave-ban{animation:none} }

function typeMult(att, def){ return BEATS[att] === def ? 1.5 : BEATS[def] === att ? 0.75 : 1; }

function leadFor(l, u){ const hit = l.to.all || l.to.type === u.type || (l.to.cat && u.cats.includes(l.to.cat)); return hit ? l : {pct:0, ki:0}; }
function passiveText(p){
  const out = [];
  if (p.atk || p.def) out.push(p.atk && p.def ? `ATK +${p.atk}% and DEF +${p.def}%` : p.atk ? `ATK +${p.atk}%` : `DEF +${p.def}%`);
  if (p.ki) out.push(`Ki +${p.ki} at the start of each turn`);
  if (p.crit) out.push(`${p.crit}% chance of a critical hit`);
  if (p.dodge) out.push(`${p.dodge}% chance to evade enemy attacks`);
  if (p.healSA) out.push(`recovers ${p.healSA}% HP when performing a Super Attack`);
  const s = out.join('; ');
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function saText(sa){
  const e = sa.eff || {}, out = [`Causes ${saWord(sa.mult)} damage to enemy`];
  if (e.atkUp) out.push(`raises ATK by ${e.atkUp}% (stacks)`);
  if (e.defUp) out.push(`raises DEF by ${e.defUp}% for 1 turn`);
  if (e.defDown) out.push(`lowers enemy DEF by ${e.defDown}%`);
  if (e.stun) out.push(`${e.stun}% chance to stun the enemy`);
  if (e.heal) out.push(`recovers ${e.heal}% HP`);
  return out.join('; ');
}

    hood:`<path d="M30,64 Q27,28 50,26 Q73,28 70,64 L66,64 Q67,38 50,36 Q33,38 34,64Z"/>`,
    bald:'',
  }[L.hair] || '';

/* ================= summon ================= */
function rollRarity(guarantee){
  const pool = guarantee ? RATES.filter(r => RANK[r[0]] >= 2) : RATES;
  let x = Math.random() * pool.reduce((a, r) => a + r[1], 0);
  for (const [k, w] of pool){ if ((x -= w) < 0) return k; }
  return pool.at(-1)[0];
}
function rollUnit(b, rar){
  const ids = Object.keys(UNITS).filter(id => UNITS[id].rar === rar);
  const feat = ids.filter(id => b.feat.includes(id));
  return feat.length && Math.random() < 0.7 ? pick(feat) : pick(ids);
}
function pull(arg){
  const [bid, nStr] = arg.split(':'), n = +nStr, cost = n === 10 ? 50 : 5, b = BANNERS.find(x => x.id === bid);
  if (S.stones < cost){ toast(`You need ${cost} Ki Stones. Clear stages or claim the daily bonus.`); return; }
  S.stones -= cost; S.pulls += n;
  const res = [];
  for (let i = 0; i < n; i++){
    const guarantee = n === 10 && i === 9 && !res.some(r => RANK[UNITS[r.id].rar] >= 2);
    const id = rollUnit(b, rollRarity(guarantee)), o = S.owned[id];
    if (o){ o.n++; const up = o.lv < 10; o.lv = Math.min(10, o.lv + 1); res.push({id, isNew:false, up}); }
    else { S.owned[id] = {lv:1, n:1}; res.push({id, isNew:true}); }
  }
  save(); render();
  showSummon(res);
}
function showSummon(res){
  const best = res.reduce((m, r) => Math.max(m, RANK[UNITS[r.id].rar]), 0);
  const bestR = Object.keys(RANK).find(k => RANK[k] === best);
  const oc = {R:'#b5794a', SR:'#c9d3e3', SSR:'#ffc93c', UR:'#ff6bd5', LR:'#ffffff'}[bestR];
  const ov = document.createElement('div'); ov.className = 'summon';
  ov.innerHTML = `<button class="orb ${bestR}" style="--oc:${oc}" aria-label="Open summon"></button><div class="hint">Tap the orb</div>`;
  $('#app').append(ov);
  ov.querySelector('.orb').addEventListener('click', () => {
    ov.innerHTML = `<h3>${best >= 3 ? 'Incredible!' : best >= 2 ? 'Nice pull!' : 'Summon results'}</h3>
      <div class="res-grid ${res.length === 1 ? 'one' : ''}">${res.map((r, i) => `<div class="res" style="animation-delay:${i * 90}ms">${unitCard(r.id, {act:'none', showLv:false})}<div class="tag ${r.isNew ? '' : 'dup'}">${r.isNew ? 'NEW' : r.up ? 'SA Lv +1' : 'Max SA'}</div></div>`).join('')}</div>
      <div class="hint">${res.map(r => UNITS[r.id]).filter(u => RANK[u.rar] >= 2).map(u => `${u.rar} ${u.name}`).join(' · ') || 'No SSR this time'}</div>
      <button class="btn go" data-act="closesummon">OK</button>`;
  }, {once:true});
}

/* ================= battle ================= */
const COLS = 6, ROWS = 5;
let B = null;
const rndSphere = () => Math.random() < 0.06 ? 'RBW' : TYPES[rnd(5)];

function mkEnemy(w){ return {...w, max:w.hp, hp:w.hp, defDown:0, attacks:[], superTurn:false, superUsed:false}; }
function startBattle(i){
  const team = S.team.filter(id => S.owned[id]);
  if (team.length < 3){ toast('Put at least 3 fighters in your team first.'); tab = 'team'; render(); return; }
  const lead = UNITS[team[0]].lead;
  const units = team.map(id => {
    const u = UNITS[id], L = leadFor(lead, u), m = 1 + L.pct / 100;
    return {id, u, lv:S.owned[id].lv, hp:u.hp * m, atk:u.atk * m, def:u.def * m, lki:L.ki, ki:0, atkUp:0, defUp:0};
  });
  const max = Math.round(units.reduce((a, x) => a + x.hp, 0));
  B = {st:STAGES[i], si:i, wave:0, units, max, hp:max, turn:0, slot:0, gauge:0, burst:false, busy:false, stun:false,
       board:Array.from({length:COLS * ROWS}, rndSphere), fresh:null};
  B.enemy = mkEnemy(B.st.waves[0]);
  buildBattle();
  waveBanner(1).then(beginTurn);
}
function buildBattle(){
  const el = document.createElement('section'); el.className = 'battle'; el.id = 'battle';
  el.innerHTML = `<div class="b-top"><b>${B.st.name}</b><span id="b-wave"></span><span class="spacer"></span><button class="retreat" data-act="retreat">Retreat</button></div>
    <div class="b-enemy" id="b-enemy">${landscape(B.st)}<div class="e-port" id="e-port"></div><div class="e-info"><div class="e-name" id="e-name"></div><div class="bar ehp"><i id="e-bar"></i></div><div class="bar-lab"><span id="e-hp"></span><span class="e-status" id="e-status"></span></div></div></div>
    <div class="b-team"><div><div class="bar-lab"><span>Team HP</span><span id="t-hp"></span></div><div class="bar thp" id="t-barw"><i id="t-bar"></i></div></div>
      <button class="burst" id="burst" data-act="burst" disabled>BURST</button>
      <div class="bar gauge" title="Burst gauge"><i id="g-bar"></i></div></div>
    <div class="rot" id="rot"></div>
    <div class="board-wrap"><div class="board" id="board" role="grid" aria-label="Ki spheres"></div></div>
    <div class="b-log" id="b-log" aria-live="polite"></div>`;
  $('#app').append(el);
  const bd = el.querySelector('#board');
  bd.addEventListener('click', e => { const t = e.target.closest('.sp'); if (t) tapSphere(+t.dataset.i); });
  bd.addEventListener('pointerover', e => { const t = e.target.closest('.sp'); if (t) preview(+t.dataset.i); });
  bd.addEventListener('pointerleave', () => preview(-1));
  renderEnemy(); renderTeam(); renderBoard();
}
function log(t){ const l = $('#b-log'); if (l) l.textContent = t; }
function renderEnemy(){
  const e = B.enemy;
  $('#b-wave').textContent = `Wave ${B.wave + 1}/${B.st.waves.length} · Turn ${B.turn + 1}`;

function updEnemy(){

function renderTeam(){
  $('#t-hp').textContent = `${fmt(B.hp)} / ${fmt(B.max)}`;
  $('#t-bar').style.width = (B.hp / B.max * 100) + '%';
  $('#t-barw').classList.toggle('low', B.hp / B.max < 0.3);

  bt.disabled = !(B.gauge >= 100 && !B.burst && B.slot < 3);

  bt.textContent = B.burst ? 'BURSTING' : 'BURST';

}
function kiLabel(x){ return x.u.rar === 'LR' && x.ki >= 18 ? '<span class="sa ultra">ULTRA</span>' : x.ki >= 12 ? '<span class="sa">SUPER</span>' : '<span></span>'; }
function renderRot(){
  if (!B.rot) return;
  const e = B.enemy;
  $('#rot').innerHTML = B.rot.map((x, k) => {
    const hits = B.stun ? 0 : e.attacks.filter(s => s === k).length;
    const sup = !B.stun && e.superTurn && !e.superUsed && e.attacks[0] === k;
    let segs = ''; for (let i = 0; i < 12; i++) segs += `<i class="${x.ki > 12 + i && maxKiOf(x.u) > 12 ? 'k2' : x.ki > i ? 'k1' : ''}"></i>`;
    return `<div class="slot r-${x.u.rar} ${k === B.slot ? 'active' : ''} ${x.done ? 'done' : ''}" id="slot${k}">
      ${hits ? `<div class="warn">${sup ? '<span class="sup">SUPER</span>' : ''}<span>! ×${hits}</span></div>` : ''}
      <div class="slot-hd"><div class="slot-pt">${portrait(x.u.look, x.u.type)}</div><div class="slot-nm"><b>${x.u.name}</b><i class="tb t-${x.u.type}">${x.u.type}</i> <span style="color:var(--rc);font-weight:700">${x.u.rar}</span></div></div>
      <div class="ki">${segs}</div><div class="ki-row">${kiLabel(x)}<span>${x.ki}/${maxKiOf(x.u)} ki</span></div></div>`;
  }).join('');
}
function renderBoard(){
  $('#board').innerHTML = B.board.map((v, i) => `<button class="sp s-${v} ${B.fresh && B.fresh.has(i) ? 'new' : ''}" data-i="${i}" data-l="${v === 'RBW' ? '' : v[0]}" aria-label="${v === 'RBW' ? 'Rainbow' : v} sphere"></button>`).join('');
  B.fresh = null;
}
function flood(i0){
  const bd = B.board, t = bd[i0], seen = new Set([i0]), q = [i0];
  while (q.length){
    const i = q.pop(), r = Math.floor(i / COLS), c = i % COLS;
    for (const [dr, dc] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nr = r + dr, nc = c + dc; if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) continue;
      const j = nr * COLS + nc; if (seen.has(j)) continue;
      if (bd[j] === t || (t !== 'RBW' && bd[j] === 'RBW')){ seen.add(j); q.push(j); }
    }
  }
  return [...seen];
}
function kiGain(x, chain){ return chain.reduce((a, i) => a + (B.board[i] === x.u.type ? 2 : 1), 0) + (B.burst ? 12 : 0); }
function preview(i){
  document.querySelectorAll('.sp.hl').forEach(s => s.classList.remove('hl'));
  document.querySelectorAll('.preview').forEach(p => p.remove());
  if (i < 0 || !B || B.busy || B.slot > 2) return;
  const chain = flood(i), sp = document.querySelectorAll('.sp');
  chain.forEach(j => sp[j] && sp[j].classList.add('hl'));
  const slot = $('#slot' + B.slot); if (!slot) return;
  const p = document.createElement('div'); p.className = 'preview'; p.textContent = `+${kiGain(B.rot[B.slot], chain)} ki`; slot.append(p);
}
function collapse(chain){
  const rm = new Set(chain); B.fresh = new Set();
  for (let c = 0; c < COLS; c++){
    const keep = [];
    for (let r = ROWS - 1; r >= 0; r--){ const i = r * COLS + c; if (!rm.has(i)) keep.push(B.board[i]); }
    let r = ROWS - 1;
    for (const v of keep){ B.board[r * COLS + c] = v; r--; }
    for (; r >= 0; r--){ const i = r * COLS + c; B.board[i] = rndSphere(); B.fresh.add(i); }
  }
}
function popAt(container, text, cls, x = 50, y = 40){
  if (!container) return;
  const p = document.createElement('div'); p.className = 'pop-n ' + (cls || ''); p.textContent = text;
  p.style.left = x + '%'; p.style.top = y + '%'; container.append(p); setTimeout(() => p.remove(), 1200);
}
function heal(pct){ const amt = B.max * pct / 100; B.hp = Math.min(B.max, B.hp + amt); popAt($('.b-team'), `+${fmt(amt)} HP`, 'info small', 30, 0); }

function beginTurn(){
  const n = B.units.length;
  B.rot = [0, 1, 2].map(k => B.units[(B.turn * 3 + k) % n]);
  B.rot.forEach(x => { x.ki = Math.min(maxKiOf(x.u), (x.u.pas.ki || 0) + x.lki); x.defUp = 0; x.done = false; });
  B.slot = 0; B.burst = false; B.stun = false;
  const e = B.enemy;
  e.attacks = Array.from({length:e.hits}, () => rnd(3)).sort((a, b) => a - b);
  e.superTurn = (B.turn + 1) % 3 === 0; e.superUsed = false;
  renderEnemy(); renderTeam(); renderRot();
  log(`${e.name} will attack ${[...new Set(e.attacks)].map(k => B.rot[k].u.name).join(' and ')}${e.superTurn ? ', with a Super Attack' : ''}. Tap spheres for ${B.rot[0].u.name}.`);
  B.busy = false;
}

async function tapSphere(i){
  if (!B || B.busy || B.slot > 2) return;
  B.busy = true; preview(-1);
  const chain = flood(i), x = B.rot[B.slot];
  const gain = kiGain(x, chain);
  B.gauge = Math.min(100, B.gauge + chain.length * 3);
  const sp = document.querySelectorAll('.sp'); chain.forEach(j => sp[j].classList.add('take'));
  await wait(260);
  collapse(chain); renderBoard();
  x.ki = Math.min(maxKiOf(x.u), x.ki + gain);
  renderRot(); renderTeam();
  await wait(220);
  const killed = await unitAttack(x);
  if (killed){ await enemyDown(); return; }
  await enemyStrikes(B.slot);
  if (B.hp <= 0){ defeat(); return; }
  x.done = true; B.slot++;
  if (B.slot > 2){ renderRot(); await wait(350); B.turn++; beginTurn(); }
  else { renderRot(); renderTeam(); log(`Tap spheres for ${B.rot[B.slot].u.name}.`); B.busy = false; }
}

async function unitAttack(x){
  const e = B.enemy, u = x.u;
  let kind = 'normal', sa = null;
  if (u.ultra && x.ki >= 18){ kind = 'ultra'; sa = u.ultra; }
  else if (x.ki >= 12){ kind = 'super'; sa = u.sa; }
  const kiM = kind === 'normal' ? 1 + x.ki * 0.06 : 1.5 + Math.max(0, x.ki - 12) * (0.5 / 12);
  const saM = sa ? sa.mult + 0.05 * (x.lv - 1) : 1;
  const atk = x.atk * (1 + ((u.pas.atk || 0) + x.atkUp) / 100) * (B.burst ? 1.5 : 1) * kiM * saM;
  const crit = Math.random() * 100 < (u.pas.crit || 0);
  const tm = typeMult(u.type, e.type);
  const edef = e.def * (1 - e.defDown / 100);
  const dmg = Math.max(1, Math.round((atk * tm * (crit ? 1.5 : 1) - (crit ? 0 : edef)) * (0.97 + Math.random() * 0.06)));
  if (sa) await superFlash(x, sa, kind);
  const port = $('#e-port'); port.classList.remove('hit'); void port.offsetWidth; port.classList.add('hit');
  e.hp = Math.max(0, e.hp - dmg);
  popAt($('#b-enemy'), fmt(dmg), crit ? 'crit' : kind === 'ultra' ? 'big' : '', 50, 30);
  if (crit) popAt($('#b-enemy'), 'CRITICAL', 'info', 50, 12);
  else if (tm > 1) popAt($('#b-enemy'), 'Type advantage', 'info small', 50, 12);
  else if (tm < 1) popAt($('#b-enemy'), 'Resisted', 'bad small', 50, 12);
  let note = '';
  if (sa){
    const f = sa.eff || {};
    if (f.atkUp){ x.atkUp += f.atkUp; note += ` ATK +${f.atkUp}%.`; }
    if (f.defUp){ x.defUp = f.defUp; note += ` DEF +${f.defUp}% this turn.`; }
    if (f.defDown){ e.defDown = Math.min(60, e.defDown + f.defDown); note += ` Enemy DEF −${f.defDown}%.`; }
    if (f.heal) heal(f.heal);
    if (f.stun && Math.random() * 100 < f.stun){ B.stun = true; popAt($('#b-enemy'), 'STUNNED', 'info', 50, 55); note += ' Enemy stunned!'; }
    if (u.pas.healSA) heal(u.pas.healSA);
  }
  log(`${u.name} ${sa ? `used ${sa.name}` : 'attacked'} for ${fmt(dmg)} damage.${note}`);
  updEnemy(); renderTeam(); renderRot();
  await wait(520);
  return e.hp <= 0;
}

async function superFlash(x, sa, kind){
  const el = document.createElement('div');
  el.className = `flash t-${x.u.type}${kind === 'ultra' ? ' ultra' : ''}`;
  el.innerHTML = `<div class="fl-art">${portrait(x.u.look, x.u.type)}</div><div class="fl-txt"><small>${kind === 'ultra' ? 'Ultra Super Attack' : 'Super Attack'}</small><b>${sa.name}</b></div>`;
  $('#battle').append(el);
  await wait(1050); el.remove();
}

async function enemyStrikes(k){
  const e = B.enemy, n = e.attacks.filter(s => s === k).length;
  if (!n || B.stun) return;
  const x = B.rot[k];
  for (let h = 0; h < n; h++){
    const isSup = e.superTurn && !e.superUsed; if (isSup) e.superUsed = true;
    await wait(200);
    if (isSup){ await superFlash({u:{type:e.type, look:e.look}}, {name:e.sup || 'Fury Blast'}, 'super'); }
    const port = $('#e-port'); port.classList.remove('lunge'); void port.offsetWidth; port.classList.add('lunge');
    await wait(220);
    const slot = $('#slot' + k);
    if (Math.random() * 100 < (x.u.pas.dodge || 0)){ popAt(slot, 'DODGE', 'info', 50, 10); log(`${x.u.name} evaded the attack!`); await wait(400); continue; }
    const tmD = BEATS[e.type] === x.u.type ? 1.5 : BEATS[x.u.type] === e.type ? 0.5 : 1;
    const raw = e.atk * (isSup ? 1.8 : 1) * tmD;
    const def = x.def * (1 + ((x.u.pas.def || 0) + x.defUp) / 100) * 0.8;
    const dmg = Math.round(Math.max(raw * 0.12, raw - def));
    B.hp = Math.max(0, B.hp - dmg);
    if (slot){ slot.classList.remove('hit'); void slot.offsetWidth; slot.classList.add('hit'); }
    popAt(slot, `−${fmt(dmg)}`, 'bad', 50, 10);
    log(`${e.name} hit ${x.u.name} for ${fmt(dmg)}${tmD > 1 ? ' (type disadvantage)' : tmD < 1 ? ' (resisted)' : ''}.`);
    renderTeam();
    await wait(450);
    if (B.hp <= 0) return;
  }
  renderRot();
}

async function waveBanner(n){
  const boss = B.st.waves[n - 1].boss;
  const el = document.createElement('div'); el.className = 'wave-ban' + (boss ? ' boss' : '');
  el.textContent = boss ? 'BOSS BATTLE' : `WAVE ${n}`;
  $('#b-enemy').append(el); B.busy = true;
  await wait(950); el.remove();
}
async function enemyDown(){
  const port = $('#e-port'); port.classList.add('down');
  log(`${B.enemy.name} is defeated!`);
  await wait(700);
  B.wave++;
  if (B.wave >= B.st.waves.length){ victory(); return; }
  B.enemy = mkEnemy(B.st.waves[B.wave]); B.turn++;
  renderEnemy();
  await waveBanner(B.wave + 1);
  beginTurn();
}
function endBattle(){ const b = $('#battle'); if (b) b.remove(); B = null; closeModal(); render(); }
function victory(){
  const st = B.st, first = !S.cleared[st.id], gain = first ? st.first : st.replay;
  S.stones += gain; S.cleared[st.id] = 1; save();
  const next = STAGES[B.si + 1];
  B.busy = true;
  modal(`<h3 style="color:var(--gold);font-size:40px;text-align:center">STAGE CLEAR!</h3>
    <p style="margin:0;text-align:center;color:var(--muted)">${st.name} cleared in ${B.turn + 1} turns with ${Math.round(B.hp / B.max * 100)}% HP left.</p>
    <div class="kv"><div><small>REWARD</small><b class="cost">${gain}</b></div><div><small>${first ? 'FIRST CLEAR' : 'REPLAY'}</small><b>${first ? 'Yes' : 'No'}</b></div><div><small>STONES</small><b>${fmt(S.stones)}</b></div></div>
    ${first && next ? `<p style="margin:0;text-align:center">New stage unlocked: <b>${next.name}</b></p>` : ''}
    <div class="row"><button class="btn" data-act="leave">Quests</button><button class="btn go" data-act="${first && next ? 'start' : 'restart'}" data-arg="${first && next ? B.si + 1 : B.si}">${first && next ? 'Next stage' : 'Replay'}</button></div>`);
}
function defeat(){
  B.busy = true;
  modal(`<h3 style="color:var(--hot);font-size:40px;text-align:center">DEFEATED</h3>
    <p style="margin:0;text-align:center;color:var(--muted)">${B.enemy.name} was too strong. Try a leader whose skill covers more of your team, collect matching spheres to hit Super Attacks, or summon new fighters.</p>
    <div class="row"><button class="btn" data-act="leave">Quests</button><button class="btn go" data-act="restart" data-arg="${B.si}">Retry</button></div>`);
}

/* ================= actions ================= */
const ACT = {
  tab(a){ tab = a; render(); },
  daily(){ if (S.daily === today()) return; S.daily = today(); S.stones += 20; save(); render(); toast('Daily bonus: +20 Ki Stones'); },
  start(a){ closeModal(); if (B) { $('#battle').remove(); B = null; } startBattle(+a); },
  restart(a){ ACT.start(a); },
  leave(){ endBattle(); },
  retreat(){ if (!B) return; modal(`<h3>Leave the battle?</h3><p style="margin:0;color:var(--muted)">You will lose progress in this stage. Stones you already spent are not affected.</p><div class="row"><button class="btn" data-act="close">Keep fighting</button><button class="btn hot" data-act="leave">Retreat</button></div>`); },
  burst(){ if (!B || B.busy || B.gauge < 100 || B.burst) return; B.burst = true; B.gauge = 0; renderTeam(); log('BURST! +12 ki on every collect and +50% ATK for the rest of this turn.'); popAt($('#b-enemy'), 'BURST!', 'big', 50, 50); },
  pull(a){ pull(a); },
  closesummon(){ document.querySelectorAll('.summon').forEach(s => s.remove()); },
  detail(a){ showDetail(a); },
  close(){ closeModal(); },
  none(){},
  slot(a){ showPicker(+a); },
  assign(id){
    const i = pickSlot, cur = S.team[i], at = S.team.indexOf(id);
    if (at >= 0 && cur) S.team[at] = cur;           // swap places
    else if (at >= 0) S.team.splice(at, 1);         // move into an empty slot
    if (i >= S.team.length) S.team.push(id); else S.team[i] = id;
    S.team = S.team.filter(Boolean);
    save(); closeModal(); render();
  },
  unassign(){ S.team.splice(pickSlot, 1); save(); closeModal(); render(); },
  makelead(id){ S.team = [id, ...S.team.filter(t => t !== id)].slice(0, 6); save(); closeModal(); tab = 'team'; render(); toast(`${UNITS[id].name} is now your leader.`); },
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  const f = ACT[t.dataset.act]; if (f) f(t.dataset.arg);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.querySelector('.modal-bg') && !(B && B.busy)) closeModal(); });

function start(data){ if (data && data.tab) tab = data.tab; render(); }
if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({tab}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body>
